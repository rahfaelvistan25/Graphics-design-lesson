<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#111a2d"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Pixel Art Grass Tile Pattern (32x32) -->
    <pattern id="pixelGrass32" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#2d6a4f"/>
      <rect x="0" y="0" width="16" height="16" fill="#388563"/>
      <rect x="16" y="16" width="16" height="16" fill="#40916c"/>
      <rect x="6" y="8" width="4" height="6" fill="#74c69d"/>
      <rect x="22" y="24" width="4" height="6" fill="#74c69d"/>
      <rect x="24" y="4" width="3" height="4" fill="#1b4332"/>
      <rect x="8" y="22" width="3" height="4" fill="#1b4332"/>
      <circle cx="12" cy="18" r="2" fill="#e9d8a6"/>
      <circle cx="28" cy="10" r="2.5" fill="#f4a261"/>
    </pattern>

    <!-- Pixel Art Cobblestone Path Pattern (32x32) -->
    <pattern id="pixelPath32" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#7f5539"/>
      <rect x="2" y="2" width="12" height="12" fill="#ddb892" rx="2"/>
      <rect x="18" y="2" width="12" height="12" fill="#b08968" rx="2"/>
      <rect x="2" y="18" width="12" height="12" fill="#9c6644" rx="2"/>
      <rect x="18" y="18" width="12" height="12" fill="#ddb892" rx="2"/>
      <circle cx="16" cy="16" r="2" fill="#582f0e"/>
      <line x1="0" y1="16" x2="32" y2="16" stroke="#4a2810" stroke-width="1.5"/>
      <line x1="16" y1="0" x2="16" y2="32" stroke="#4a2810" stroke-width="1.5"/>
    </pattern>

    <!-- Pixel Art Water Ripple Pattern (32x32) -->
    <pattern id="pixelWater32" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#1d3557"/>
      <rect x="0" y="0" width="32" height="16" fill="#2a4d7d"/>
      <path d="M 0 10 Q 8 6, 16 10 T 32 10" fill="none" stroke="#64dfdf" stroke-width="2.5"/>
      <path d="M 0 26 Q 8 22, 16 26 T 32 26" fill="none" stroke="#a2d2ff" stroke-width="2"/>
    </pattern>

    <!-- Geometric Hexagon Tessellation Pattern -->
    <pattern id="tessPattern" width="70" height="121.24" patternUnits="userSpaceOnUse">
      <g stroke="#38bdf8" stroke-width="1.5">
        <polygon points="35,0 70,20.2 70,60.6 35,80.8 0,60.6 0,20.2" fill="#312e81"/>
        <polygon points="35,80.8 70,101 70,141.4 35,161.6 0,141.4 0,101" fill="#4338ca"/>
        <polygon points="105,20.2 140,40.4 140,80.8 105,101 70,80.8 70,40.4" fill="#3730a3"/>
        <polygon points="-35,20.2 0,40.4 0,80.8 -35,101 -70,80.8 -70,40.4" fill="#3730a3"/>
        <!-- 3D Shading planes -->
        <polygon points="35,40.4 70,20.2 70,60.6 35,80.8" fill="#4f46e5" fill-opacity="0.4"/>
        <polygon points="35,40.4 0,20.2 0,60.6 35,80.8" fill="#1e1b4b" fill-opacity="0.5"/>
      </g>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow7" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowTile" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg7)"/>

  <!-- Left Side Showcase: Retro Pixel-Art Game Tile Map -->
  <g transform="translate(45, 45)" filter="url(#shadow7)">
    <rect width="525" height="585" rx="18" fill="#131c2d" stroke="#25354e" stroke-width="1.8"/>

    <!-- Header Badge -->
    <g transform="translate(30, 26)">
      <rect width="260" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="21" fill="#34d399" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">PIXEL-ART REPEATING TILE MAP</text>
    </g>

    <!-- Game Viewport Frame -->
    <g transform="translate(30, 75)">
      <rect width="465" height="360" rx="12" fill="#090f1a" stroke="#334766" stroke-width="2"/>
      
      <!-- Base Grass Grid -->
      <rect x="4" y="4" width="457" height="352" rx="10" fill="url(#pixelGrass32)"/>

      <!-- Water River (Curving / Repeating Band) -->
      <rect x="4" y="240" width="457" height="116" rx="8" fill="url(#pixelWater32)"/>

      <!-- Cobblestone Road Crossing -->
      <rect x="180" y="4" width="96" height="352" fill="url(#pixelPath32)"/>

      <!-- Wooden Bridge over River -->
      <rect x="164" y="235" width="128" height="60" rx="4" fill="#582f0e" stroke="#2d1500" stroke-width="3"/>
      <line x1="164" y1="255" x2="292" y2="255" stroke="#7f4f24" stroke-width="2" stroke-dasharray="8 4"/>
      <line x1="164" y1="275" x2="292" y2="275" stroke="#7f4f24" stroke-width="2" stroke-dasharray="8 4"/>

      <!-- Pixel Player Character Sprite standing on path -->
      <g transform="translate(216, 120)">
        <!-- Head / Hat -->
        <rect x="4" y="0" width="16" height="8" fill="#e63946"/>
        <rect x="6" y="8" width="12" height="10" fill="#fcd5ce"/>
        <!-- Body / Shirt -->
        <rect x="2" y="18" width="20" height="16" fill="#1d3557"/>
        <!-- Pants / Legs -->
        <rect x="4" y="34" width="7" height="12" fill="#457b9d"/>
        <rect x="13" y="34" width="7" height="12" fill="#457b9d"/>
      </g>

      <!-- Grid Overlay Lines showing repeating tile coordinates -->
      <path d="M 68 4 V 356 M 132 4 V 356 M 196 4 V 356 M 260 4 V 356 M 324 4 V 356 M 388 4 V 356" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>
      <path d="M 4 68 H 461 M 4 132 H 461 M 4 196 H 461 M 4 260 H 461 M 4 324 H 461" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>

      <!-- Highlighted Single 32px Tile Callout -->
      <rect x="68" y="68" width="64" height="64" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#glowTile)"/>
      <line x1="132" y1="100" x2="200" y2="55" stroke="#f59e0b" stroke-width="2"/>
      <rect x="200" y="40" width="180" height="28" rx="6" fill="#f59e0b"/>
      <text x="290" y="59" fill="#000000" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">SINGLE REPEATING UNIT</text>
    </g>

    <!-- Explanatory Caption Bar -->
    <g transform="translate(30, 460)">
      <rect width="465" height="96" rx="10" fill="#0c1320" stroke="#1f2c41" stroke-width="1"/>
      <text x="20" y="30" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Seamless Grid Repetition</text>
      <text x="20" y="54" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Individual grass, stone, and water modules lock edge-to-edge</text>
      <text x="20" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">to construct an infinite visual world with zero seam gaps.</text>
    </g>
  </g>

  <!-- Right Side Showcase: Modern Geometric Tessellation -->
  <g transform="translate(630, 45)" filter="url(#shadow7)">
    <rect width="525" height="585" rx="18" fill="#131c2d" stroke="#25354e" stroke-width="1.8"/>

    <!-- Header Badge -->
    <g transform="translate(30, 26)">
      <rect width="270" height="32" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8"/>
      <text x="32" y="21" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">GEOMETRIC TESSELLATION</text>
    </g>

    <!-- Canvas Frame -->
    <g transform="translate(30, 75)">
      <rect width="465" height="360" rx="12" fill="#0c0a24" stroke="#334766" stroke-width="2"/>
      
      <!-- Clipped Tessellation Pattern -->
      <g clip-path="url(#tessClipFrame)">
        <clipPath id="tessClipFrame">
          <rect width="465" height="360" rx="12"/>
        </clipPath>
        <rect width="465" height="360" fill="url(#tessPattern)"/>
      </g>

      <!-- Floating Callout Card Highlighting Mathematical Fit -->
      <g transform="translate(130, 100)" filter="url(#shadow7)">
        <rect width="210" height="155" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="2"/>
        
        <!-- Isolated Hexagon Unit Diagram -->
        <g transform="translate(105, 50)">
          <polygon points="0,-35 30.3,-17.5 30.3,17.5 0,35 -30.3,17.5 -30.3,-17.5" fill="#4338ca" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowTile)"/>
          <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
        </g>
        
        <text x="105" y="112" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">INTERLOCKING UNIT</text>
        <text x="105" y="132" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">100% Surface Coverage</text>
      </g>
    </g>

    <!-- Explanatory Caption Bar -->
    <g transform="translate(30, 460)">
      <rect width="465" height="96" rx="10" fill="#0c1320" stroke="#1f2c41" stroke-width="1"/>
      <text x="20" y="30" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Mathematical Visual Rhythm</text>
      <text x="20" y="54" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Interlocking polygonal symmetry creates hypnotic background</text>
      <text x="20" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">depth without distracting from foreground typography.</text>
    </g>
  </g>
</svg>
