<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <!-- Masterpiece Glow Gradient -->
    <linearGradient id="heroGrad13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <filter id="shadow13" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glowFocal13" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg13)"/>

  <!-- PILLAR 1: THE ELEMENTS (RAW INGREDIENTS) -->
  <g transform="translate(45, 45)" filter="url(#shadow13)">
    <rect width="320" height="585" rx="18" fill="#131b2b" stroke="#25354e" stroke-width="1.8"/>
    
    <!-- Header Tag -->
    <rect x="25" y="28" width="150" height="28" rx="6" fill="#0c1322"/>
    <text x="36" y="46" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">RAW INGREDIENTS</text>
    
    <text x="25" y="100" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="900">ELEMENTS</text>
    <text x="25" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">What you build with</text>

    <!-- Element Item 1 -->
    <rect x="25" y="155" width="270" height="52" rx="10" fill="#0b111c" stroke="#1e293b" stroke-width="1"/>
    <circle cx="48" cy="181" r="6" fill="#38bdf8"/>
    <text x="68" y="186" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Line &amp; Shape</text>

    <!-- Element Item 2 -->
    <rect x="25" y="220" width="270" height="52" rx="10" fill="#0b111c" stroke="#1e293b" stroke-width="1"/>
    <circle cx="48" cy="246" r="6" fill="#38bdf8"/>
    <text x="68" y="251" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Color &amp; Value</text>

    <!-- Element Item 3 -->
    <rect x="25" y="285" width="270" height="52" rx="10" fill="#0b111c" stroke="#1e293b" stroke-width="1"/>
    <circle cx="48" cy="311" r="6" fill="#38bdf8"/>
    <text x="68" y="316" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Texture &amp; Form</text>

    <!-- Element Item 4 -->
    <rect x="25" y="350" width="270" height="52" rx="10" fill="#0b111c" stroke="#1e293b" stroke-width="1"/>
    <circle cx="48" cy="376" r="6" fill="#38bdf8"/>
    <text x="68" y="381" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Space &amp; Typography</text>

    <!-- Explanatory note -->
    <g transform="translate(25, 480)">
      <rect width="270" height="75" rx="10" fill="#0b111c"/>
      <text x="16" y="32" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Analogous to flour, sugar,</text>
      <text x="16" y="52" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">butter, and spices in baking.</text>
    </g>
  </g>

  <!-- OPERATOR: PLUS (+) -->
  <g transform="translate(390, 315)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" text-anchor="middle">+</text>
  </g>

  <!-- PILLAR 2: THE PRINCIPLES (THE RECIPE) -->
  <g transform="translate(435, 45)" filter="url(#shadow13)">
    <rect width="320" height="585" rx="18" fill="#161b2e" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Header Tag -->
    <rect x="25" y="28" width="130" height="28" rx="6" fill="#2e1065"/>
    <text x="36" y="46" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">THE RECIPE</text>
    
    <text x="25" y="100" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="900">PRINCIPLES</text>
    <text x="25" y="125" fill="#c084fc" font-family="'Inter', sans-serif" font-size="14">How you arrange them</text>

    <!-- Principle Item 1 -->
    <rect x="25" y="155" width="270" height="52" rx="10" fill="#211538" stroke="#3b1d60" stroke-width="1"/>
    <circle cx="48" cy="181" r="6" fill="#c084fc"/>
    <text x="68" y="186" fill="#f3e8ff" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Balance &amp; Unity</text>

    <!-- Principle Item 2 -->
    <rect x="25" y="220" width="270" height="52" rx="10" fill="#211538" stroke="#3b1d60" stroke-width="1"/>
    <circle cx="48" cy="246" r="6" fill="#c084fc"/>
    <text x="68" y="251" fill="#f3e8ff" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Contrast &amp; Emphasis</text>

    <!-- Principle Item 3 -->
    <rect x="25" y="285" width="270" height="52" rx="10" fill="#211538" stroke="#3b1d60" stroke-width="1"/>
    <circle cx="48" cy="311" r="6" fill="#c084fc"/>
    <text x="68" y="316" fill="#f3e8ff" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Rhythm &amp; Movement</text>

    <!-- Principle Item 4 -->
    <rect x="25" y="350" width="270" height="52" rx="10" fill="#211538" stroke="#3b1d60" stroke-width="1"/>
    <circle cx="48" cy="376" r="6" fill="#c084fc"/>
    <text x="68" y="381" fill="#f3e8ff" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Proportion &amp; Variety</text>

    <!-- Explanatory note -->
    <g transform="translate(25, 480)">
      <rect width="270" height="75" rx="10" fill="#1e1035"/>
      <text x="16" y="32" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12">Analogous to the chef&apos;s</text>
      <text x="16" y="52" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12">precise timing, balance, and heat.</text>
    </g>
  </g>

  <!-- OPERATOR: EQUALS (=) -->
  <g transform="translate(780, 315)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" text-anchor="middle">=</text>
  </g>

  <!-- PILLAR 3: EFFECTIVE DESIGN (THE FINAL DISH) -->
  <g transform="translate(825, 45)" filter="url(#glowFocal13)">
    <rect width="330" height="585" rx="18" fill="url(#heroGrad13)" stroke="#f472b6" stroke-width="2"/>
    
    <!-- Header Tag -->
    <rect x="28" y="28" width="135" height="28" rx="6" fill="#000000" fill-opacity="0.3"/>
    <text x="40" y="46" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">THE FINAL DISH</text>
    
    <text x="28" y="100" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="900">EFFECTIVE</text>
    <text x="28" y="132" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="900">DESIGN</text>

    <!-- Centerpiece Emblem Showcase -->
    <g transform="translate(28, 160)">
      <rect width="274" height="235" rx="14" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="137" cy="85" r="50" fill="#ffffff" fill-opacity="0.2"/>
      <polygon points="137,55 165,105 109,105" fill="#ffffff"/>
      <text x="137" y="165" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle">PROFESSIONAL</text>
      <text x="137" y="190" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle">&amp; ENGAGING</text>
      <text x="137" y="215" fill="#fce7f3" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Intuitive UI · High Impact</text>
    </g>

    <!-- Explanatory note -->
    <g transform="translate(28, 480)">
      <text x="0" y="20" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Intentional Craft</text>
      <text x="0" y="42" fill="#fdf2f8" font-family="'Inter', sans-serif" font-size="12">Combining these principles elevates</text>
      <text x="0" y="62" fill="#fdf2f8" font-family="'Inter', sans-serif" font-size="12">basic elements into world-class work.</text>
    </g>
  </g>
</svg>
