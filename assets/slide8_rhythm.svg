<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c"/>
      <stop offset="50%" stop-color="#11192a"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="barGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="waveGrad8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow8" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg8)"/>

  <!-- Main Showcase Container -->
  <g transform="translate(50, 45)" filter="url(#shadow8)">
    <rect width="1100" height="585" rx="20" fill="#111827" stroke="#25354e" stroke-width="2"/>

    <!-- Top Tempo Header -->
    <g transform="translate(60, 40)">
      <rect width="250" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="5" fill="#8b5cf6"/>
      <text x="32" y="21" fill="#c084fc" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">VISUAL TEMPO &amp; CADENCE</text>
    </g>

    <!-- Musical Tempo & Progression Arc -->
    <path d="M 60 160 Q 320 70, 600 170 T 1040 120" fill="none" stroke="url(#waveGrad8)" stroke-width="4" stroke-dasharray="8 5" filter="url(#glow8)"/>
    <text x="70" y="115" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14" font-weight="700">MODERATE TEMPO (WIDE SPACING)</text>
    <text x="660" y="115" fill="#ec4899" font-family="'Inter', sans-serif" font-size="14" font-weight="700">CRESCENDO / RAPID SYNCOPATION</text>

    <!-- Visual Rhythmic Columns: Progressive thickness and spacing from left to right -->
    <!-- Slow, Wide, Thin columns on left -->
    <rect x="70" y="200" width="8" height="260" rx="4" fill="url(#barGrad8)" opacity="0.6"/>
    <rect x="145" y="185" width="12" height="290" rx="6" fill="url(#barGrad8)" opacity="0.65"/>
    <rect x="235" y="170" width="18" height="320" rx="9" fill="url(#barGrad8)" opacity="0.7"/>
    <rect x="340" y="155" width="26" height="350" rx="13" fill="url(#barGrad8)" opacity="0.75"/>
    <rect x="460" y="140" width="36" height="380" rx="16" fill="url(#barGrad8)" opacity="0.85"/>

    <!-- Dynamic Rapid Syncopation in center-right -->
    <rect x="585" y="155" width="48" height="350" rx="18" fill="url(#barGrad8)" opacity="0.9"/>
    <rect x="680" y="125" width="58" height="410" rx="20" fill="url(#barGrad8)" filter="url(#glow8)"/>
    <rect x="765" y="175" width="44" height="310" rx="16" fill="url(#barGrad8)" opacity="0.9"/>
    <rect x="835" y="140" width="38" height="380" rx="14" fill="url(#barGrad8)" opacity="0.85"/>
    <rect x="895" y="165" width="28" height="330" rx="12" fill="url(#barGrad8)" opacity="0.8"/>
    <rect x="945" y="185" width="18" height="290" rx="8" fill="url(#barGrad8)" opacity="0.7"/>
    <rect x="985" y="205" width="12" height="250" rx="6" fill="url(#barGrad8)" opacity="0.6"/>
    <rect x="1018" y="225" width="7" height="210" rx="3.5" fill="url(#barGrad8)" opacity="0.5"/>

    <!-- Annotated interval markers at bottom -->
    <g transform="translate(0, 500)">
      <line x1="70" y1="10" x2="340" y2="10" stroke="#64748b" stroke-width="1.5"/>
      <line x1="70" y1="4" x2="70" y2="16" stroke="#64748b" stroke-width="1.5"/>
      <line x1="340" y1="4" x2="340" y2="16" stroke="#64748b" stroke-width="1.5"/>
      <text x="205" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Slow Beat (Wide Space)</text>

      <line x1="585" y1="10" x2="765" y2="10" stroke="#f59e0b" stroke-width="2"/>
      <line x1="585" y1="4" x2="585" y2="16" stroke="#f59e0b" stroke-width="2"/>
      <line x1="765" y1="4" x2="765" y2="16" stroke="#f59e0b" stroke-width="2"/>
      <text x="675" y="32" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Climax / Heavy Beat</text>

      <line x1="835" y1="10" x2="1025" y2="10" stroke="#64748b" stroke-width="1.5"/>
      <line x1="835" y1="4" x2="835" y2="16" stroke="#64748b" stroke-width="1.5"/>
      <line x1="1025" y1="4" x2="1025" y2="16" stroke="#64748b" stroke-width="1.5"/>
      <text x="930" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Compressed Syncopation</text>
    </g>
  </g>
</svg>
