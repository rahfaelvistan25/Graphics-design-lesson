<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="wpaBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="woodTypeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#wpaBg3)"/>

  <!-- Vintage Woodcut Framing & Border -->
  <rect x="30" y="30" width="740" height="490" fill="none" stroke="#78350f" stroke-width="4"/>
  <rect x="38" y="38" width="724" height="474" fill="none" stroke="#d97706" stroke-width="1"/>

  <!-- Top Hero Poster Banner: Screenprinted Silkscreen Aesthetic -->
  <g transform="translate(60, 60)">
    <rect width="680" height="280" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
    
    <!-- Graphic Horizon & Sun / Mountain Cutout -->
    <polygon points="0,200 180,90 320,180 460,70 680,220 680,280 0,280" fill="#78350f" fill-opacity="0.4"/>
    <polygon points="0,240 140,160 280,220 440,140 680,250 680,280 0,280" fill="#0f766e" fill-opacity="0.5"/>
    <circle cx="520" cy="90" r="45" fill="#f59e0b" fill-opacity="0.2"/>

    <!-- Bold Condensed Wood-Type Header -->
    <text x="340" y="55" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="4">WORK &#8226; RECOVERY &#8226; DIGNITY</text>
    <text x="340" y="85" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="2">FEDERAL ART PROJECT &#8226; WORKS PROGRESS ADMINISTRATION (WPA)</text>

    <!-- Industrial Silhouette Icons: Gear, Anvil, Grain -->
    <g transform="translate(100, 120)">
      <!-- Gear -->
      <circle cx="40" cy="50" r="30" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="14 6"/>
      <circle cx="40" cy="50" r="14" fill="#f59e0b"/>
      <text x="40" y="115" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#fed7aa">LABOR</text>
    </g>

    <g transform="translate(300, 120)">
      <!-- Electrical Pylon (Lester Beall REA Tribute) -->
      <line x1="40" y1="15" x2="10" y2="90" stroke="#38bdf8" stroke-width="4"/>
      <line x1="40" y1="15" x2="70" y2="90" stroke="#38bdf8" stroke-width="4"/>
      <line x1="20" y1="45" x2="60" y2="45" stroke="#38bdf8" stroke-width="3"/>
      <line x1="12" y1="70" x2="68" y2="70" stroke="#38bdf8" stroke-width="3"/>
      <text x="40" y="115" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#bae6fd">POWER</text>
    </g>

    <g transform="translate(500, 120)">
      <!-- National Parks / Travel Arrow -->
      <polygon points="40,20 15,85 65,85" fill="#10b981"/>
      <polygon points="40,35 25,85 55,85" fill="#34d399"/>
      <text x="40" y="115" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#a7f3d0">CONSERVATION</text>
    </g>
  </g>

  <!-- Bottom Breakdown Pillars -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="210" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#fbbf24">1. WPA SILKSCREENING</text>
    <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <tspan x="16" dy="0">Pragmatic, high-output print</tspan>
      <tspan x="16" dy="18">shops employed artists during</tspan>
      <tspan x="16" dy="18">the Depression using 3-4 flat</tspan>
      <tspan x="16" dy="18">opaque color separations.</tspan>
    </text>

    <rect x="235" y="0" width="210" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="251" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#fbbf24">2. LESTER BEALL'S REA</text>
    <text x="251" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <tspan x="251" dy="0">Pioneered modern photomontage,</tspan>
      <tspan x="251" dy="18">bold geometric arrows, and</tspan>
      <tspan x="251" dy="18">graphic symbols communicating</tspan>
      <tspan x="251" dy="18">to rural non-literate citizens.</tspan>
    </text>

    <rect x="470" y="0" width="210" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="486" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#fbbf24">3. PALETTE &amp; TYPE</text>
    <g transform="translate(486, 45)">
      <circle cx="12" cy="10" r="10" fill="#b45309" stroke="#ffffff" stroke-width="1"/>
      <circle cx="42" cy="10" r="10" fill="#1e3a8a" stroke="#ffffff" stroke-width="1"/>
      <circle cx="72" cy="10" r="10" fill="#047857" stroke="#ffffff" stroke-width="1"/>
      <circle cx="102" cy="10" r="10" fill="#78350f" stroke="#ffffff" stroke-width="1"/>
      <circle cx="132" cy="10" r="10" fill="#fef3c7" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Futura Bold &#8226; Gill Sans</text>
      <text x="0" y="60" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Kabel &#8226; Condensed Wood Type</text>
    </g>
  </g>
</svg>