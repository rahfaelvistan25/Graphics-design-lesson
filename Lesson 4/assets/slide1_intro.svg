<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="spectrum1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="20%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pendulumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad1)"/>

  <!-- Subtle Decade Grid Guides -->
  <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3">
    <line x1="80" y1="90" x2="80" y2="480"/>
    <line x1="140" y1="90" x2="140" y2="480"/>
    <line x1="200" y1="90" x2="200" y2="480"/>
    <line x1="260" y1="90" x2="260" y2="480"/>
    <line x1="320" y1="90" x2="320" y2="480"/>
    <line x1="380" y1="90" x2="380" y2="480"/>
    <line x1="440" y1="90" x2="440" y2="480"/>
    <line x1="500" y1="90" x2="500" y2="480"/>
    <line x1="560" y1="90" x2="560" y2="480"/>
    <line x1="620" y1="90" x2="620" y2="480"/>
    <line x1="680" y1="90" x2="680" y2="480"/>
    <line x1="740" y1="90" x2="740" y2="480"/>
  </g>

  <!-- Top Title Badge -->
  <g transform="translate(40, 24)">
    <rect width="260" height="30" rx="15" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="1.2"/>
    <text x="16" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f43f5e" letter-spacing="1.2">CHRONOLOGY OF DESIGN</text>
    <text x="290" y="21" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">A Century of Visual Revolutions (1920s – 2020s)</text>
  </g>

  <!-- Central Visual: The Cyclical Pendulum of Design -->
  <g transform="translate(40, 75)" filter="url(#shadow1)">
    <!-- Container Card -->
    <rect width="720" height="230" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Top Pole: Maximum Expression & Ornamentation -->
    <rect x="20" y="16" width="280" height="32" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <circle cx="36" cy="32" r="5" fill="#f43f5e"/>
    <text x="50" y="36" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#fda4af">ORNAMENTATION &amp; EMOTION</text>
    <text x="320" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Art Deco (20s) &#8226; Psychedelic (60s) &#8226; Punk/Groovy (70s) &#8226; Memphis (80s) &#8226; Neo-Brutalism (20s)</text>

    <!-- Bottom Pole: Maximum Order & Rational Function -->
    <rect x="20" y="180" width="280" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="36" cy="196" r="5" fill="#38bdf8"/>
    <text x="50" y="200" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">RATIONALISM &amp; MINIMALISM</text>
    <text x="320" y="200" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">WPA Realism (30s) &#8226; Swiss Modern (50s/60s) &#8226; Web 2.0 (00s) &#8226; Flat Design (10s)</text>

    <!-- Sine Wave Oscillation Track -->
    <path d="M 60 70 Q 120 160, 180 150 T 300 70 T 420 160 T 540 60 T 660 150 T 700 80" fill="none" stroke="url(#spectrum1)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Decade Nodes on Curve -->
    <g transform="translate(60, 70)">
      <circle cx="0" cy="0" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">'20s DECO</text>
    </g>
    <g transform="translate(180, 150)">
      <circle cx="0" cy="0" r="10" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">'30s WPA</text>
    </g>
    <g transform="translate(240, 130)">
      <circle cx="0" cy="0" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#f87171">'40s WAR</text>
    </g>
    <g transform="translate(300, 70)">
      <circle cx="0" cy="0" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#22d3ee">'50s BOOM</text>
    </g>
    <g transform="translate(360, 110)">
      <circle cx="0" cy="0" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#c084fc">'60s DUAL</text>
    </g>
    <g transform="translate(420, 160)">
      <circle cx="0" cy="0" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">'70s PUNK</text>
    </g>
    <g transform="translate(490, 75)">
      <circle cx="0" cy="0" r="10" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#f472b6">'80s NEON</text>
    </g>
    <g transform="translate(560, 110)">
      <circle cx="0" cy="0" r="10" fill="#84cc16" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#a3e635">'90s GRUNGE</text>
    </g>
    <g transform="translate(620, 155)">
      <circle cx="0" cy="0" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">'00s SKEUO</text>
    </g>
    <g transform="translate(670, 145)">
      <circle cx="0" cy="0" r="10" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#818cf8">'10s FLAT</text>
    </g>
    <g transform="translate(700, 80)">
      <circle cx="0" cy="0" r="10" fill="#ccff00" stroke="#000000" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#ccff00">'20s NEO</text>
    </g>
  </g>

  <!-- Bottom Timeline Cards: The 3 Core Drivers -->
  <g transform="translate(40, 325)">
    <!-- Driver 1: Technology -->
    <rect x="0" y="0" width="225" height="190" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#ec4899" fill-opacity="0.2"/>
    <text x="34" y="39" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#f43f5e">⚙️</text>
    <text x="64" y="34" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Technological Medium</text>
    <text x="64" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">The Tools Define the Shape</text>
    <text x="16" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <tspan x="16" dy="0">&#8226; 1920s: Lithographic Stone &amp; Press</tspan>
      <tspan x="16" dy="18">&#8226; 1950s: Modern Offset Litho &amp; Halftone</tspan>
      <tspan x="16" dy="18">&#8226; 1980s: Apple Macintosh (PostScript)</tspan>
      <tspan x="16" dy="18">&#8226; 2000s: Web Browsers &amp; Screen Pixels</tspan>
      <tspan x="16" dy="18">&#8226; 2020s: Generative AI &amp; Variable Fonts</tspan>
    </text>

    <!-- Driver 2: Socio-Economic Shifts -->
    <rect x="245" y="0" width="225" height="190" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <rect x="261" y="16" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="279" y="39" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#38bdf8">🏛️</text>
    <text x="309" y="34" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Historical Climate</text>
    <text x="309" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Crisis vs. Prosperity</text>
    <text x="261" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <tspan x="261" dy="0">&#8226; 1920s: Roaring Post-WWI Euphoria</tspan>
      <tspan x="261" dy="18">&#8226; 1930s: Great Depression &amp; WPA</tspan>
      <tspan x="261" dy="18">&#8226; 1940s: WWII War Mobilization</tspan>
      <tspan x="261" dy="18">&#8226; 1950s: Suburbia &amp; Consumer Boom</tspan>
      <tspan x="261" dy="18">&#8226; 1970s: Oil Crisis &amp; Punk Disillusion</tspan>
    </text>

    <!-- Driver 3: Generational Rebellions -->
    <rect x="490" y="0" width="230" height="190" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <rect x="506" y="16" width="36" height="36" rx="8" fill="#a855f7" fill-opacity="0.2"/>
    <text x="524" y="39" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#c084fc">⚡</text>
    <text x="554" y="34" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Aesthetic Counter-Action</text>
    <text x="554" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Every Generation Rebels</text>
    <text x="506" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <tspan x="506" dy="0">&#8226; 60s Psychedelia destroyed 50s grid</tspan>
      <tspan x="506" dy="18">&#8226; 70s Punk shredded corporate polish</tspan>
      <tspan x="506" dy="18">&#8226; 90s Grunge attacked 80s neon gloss</tspan>
      <tspan x="506" dy="18">&#8226; 10s Flat stripped 00s skeuomorphism</tspan>
      <tspan x="506" dy="18">&#8226; 20s Brutalism broke sterile UI cards</tspan>
    </text>
  </g>
</svg>