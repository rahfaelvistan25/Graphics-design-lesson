<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2e0854"/>
      <stop offset="50%" stop-color="#120224"/>
      <stop offset="100%" stop-color="#05000a"/>
    </radialGradient>
    <linearGradient id="neonPink8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="neonCyan8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sunset8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bg8)"/>

  <!-- 3D Neon Perspective Grid (Synthwave Horizon) -->
  <g opacity="0.6">
    <line x1="400" y1="220" x2="0" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="100" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="200" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="300" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="400" y2="480" stroke="#06b6d4" stroke-width="2"/>
    <line x1="400" y1="220" x2="500" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="600" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="700" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="800" y2="480" stroke="#06b6d4" stroke-width="1.5"/>
    
    <!-- Horizontal Grid Lines -->
    <line x1="280" y1="240" x2="520" y2="240" stroke="#ec4899" stroke-width="1"/>
    <line x1="220" y1="270" x2="580" y2="270" stroke="#ec4899" stroke-width="1.2"/>
    <line x1="160" y1="315" x2="640" y2="315" stroke="#ec4899" stroke-width="1.5"/>
    <line x1="90" y1="375" x2="710" y2="375" stroke="#ec4899" stroke-width="1.8"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#ec4899" stroke-width="2.2"/>
  </g>

  <!-- Big Glowing Synthwave Sun -->
  <circle cx="400" cy="210" r="75" fill="url(#sunset8)"/>
  <!-- Sun Blinds Slices -->
  <rect x="320" y="210" width="160" height="4" fill="#120224"/>
  <rect x="320" y="222" width="160" height="7" fill="#120224"/>
  <rect x="320" y="238" width="160" height="11" fill="#120224"/>
  <rect x="320" y="258" width="160" height="15" fill="#120224"/>

  <!-- Memphis Milano Geometric Squiggles & Confetti (Ettore Sottsass Tribute) -->
  <g transform="translate(80, 80)">
    <!-- Yellow Squiggle -->
    <path d="M 10 20 Q 30 5, 50 20 T 90 20 T 130 20" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round"/>
    <!-- Black and White Zebra Triangle -->
    <polygon points="120,40 180,120 60,120" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <!-- Confetti Dots -->
    <circle cx="20" cy="80" r="6" fill="#06b6d4"/>
    <circle cx="50" cy="110" r="4" fill="#a855f7"/>
    <circle cx="80" cy="70" r="5" fill="#facc15"/>
    <rect x="15" y="125" width="40" height="12" rx="6" fill="#10b981" transform="rotate(25 35 131)"/>
  </g>

  <g transform="translate(620, 80)">
    <!-- Cyan Zig-zag -->
    <path d="M 0 30 L 20 10 L 40 30 L 60 10 L 80 30" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
    <rect x="20" y="55" width="50" height="50" fill="#f43f5e" stroke="#facc15" stroke-width="3" transform="rotate(-15 45 80)"/>
    <circle cx="65" cy="125" r="8" fill="#facc15"/>
    <circle cx="15" cy="110" r="5" fill="#ec4899"/>
  </g>

  <!-- Top Header Title -->
  <g transform="translate(400, 50)">
    <text x="0" y="0" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="4">THE 1980s: EXCESS &amp; NEON</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="3">MEMPHIS MILANO &#8226; MTV GENERATION &#8226; CYBERPUNK SYNTHWAVE</text>
  </g>

  <!-- Bottom Information Cards -->
  <g transform="translate(60, 395)">
    <!-- Card 1: Memphis -->
    <rect x="0" y="0" width="210" height="110" rx="8" fill="#18052e" stroke="#ec4899" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#f472b6">MEMPHIS MILANO</text>
    <text x="16" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#fbcfe8">
      <tspan x="16" dy="0">Ettore Sottsass shattered good</tspan>
      <tspan x="16" dy="16">taste with clashing plastic</tspan>
      <tspan x="16" dy="16">laminates, squiggles, pastel</tspan>
      <tspan x="16" dy="16">asymmetry &amp; rebellious kitsch.</tspan>
    </text>

    <!-- Card 2: Macintosh & MTV -->
    <rect x="235" y="0" width="210" height="110" rx="8" fill="#18052e" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="251" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#67e8f9">MACINTOSH &amp; MTV</text>
    <text x="251" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#cffafe">
      <tspan x="251" dy="0">1984 Apple Mac birthed digital</tspan>
      <tspan x="251" dy="16">desktop publishing, while MTV's</tspan>
      <tspan x="251" dy="16">fluid morphing logo ushered in</tspan>
      <tspan x="251" dy="16">the kinetic motion graphics age.</tspan>
    </text>

    <!-- Card 3: Color Swatches -->
    <rect x="470" y="0" width="210" height="110" rx="8" fill="#18052e" stroke="#facc15" stroke-width="1.5"/>
    <text x="486" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#fde047">NEON PALETTE</text>
    <g transform="translate(486, 40)">
      <circle cx="12" cy="12" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="1"/>
      <circle cx="42" cy="12" r="11" fill="#06b6d4" stroke="#ffffff" stroke-width="1"/>
      <circle cx="72" cy="12" r="11" fill="#facc15" stroke="#ffffff" stroke-width="1"/>
      <circle cx="102" cy="12" r="11" fill="#8b5cf6" stroke="#ffffff" stroke-width="1"/>
      <circle cx="132" cy="12" r="11" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#fef08a">Mistral &#8226; Chicago &#8226; Neon Script</text>
    </g>
  </g>
</svg>