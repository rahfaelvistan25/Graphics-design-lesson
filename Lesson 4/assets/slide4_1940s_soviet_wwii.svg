<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="patrioticRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bg4)"/>

  <!-- Dynamic Constructivist Diagonal Slash (El Lissitzky Tribute) -->
  <polygon points="50,480 380,80 430,80 100,480" fill="#dc2626" fill-opacity="0.85"/>
  <polygon points="120,490 520,120 540,120 140,490" fill="#f59e0b" fill-opacity="0.75"/>
  <polygon points="20,470 260,180 290,180 50,470" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Top Hero Header -->
  <g transform="translate(60, 45)">
    <rect width="250" height="28" rx="14" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.2"/>
    <text x="16" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f87171" letter-spacing="1.5">WWII PROPAGANDA &amp; SOVIET ROOTS</text>
    <text x="280" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Urgency, Patriotic Resolve &amp; Constructivist Dynamics (1940s)</text>
  </g>

  <!-- Left Side: Rosie the Riveter "We Can Do It!" Graphic Tribute -->
  <g transform="translate(60, 95)">
    <rect width="320" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Yellow Oval Background of famous poster -->
    <ellipse cx="160" cy="120" rx="140" ry="90" fill="#eab308" fill-opacity="0.9"/>
    
    <!-- Blue Comic Dialogue Bubble -->
    <rect x="40" y="20" width="240" height="42" rx="21" fill="#1e3a8a" stroke="#ffffff" stroke-width="2"/>
    <text x="160" y="47" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1">We Can Do It!</text>
    
    <!-- Flexing Arm Silhouette -->
    <path d="M 120 190 Q 150 130, 200 140 Q 230 110, 210 80 Q 180 80, 160 110 L 130 140 Z" fill="#dc2626"/>
    <circle cx="160" cy="180" r="28" fill="#1e3a8a"/>

    <text x="160" y="225" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0f172a">J. HOWARD MILLER &#8226; WESTINGHOUSE 1943</text>
  </g>

  <!-- Right Side: Soviet Constructivist Geometry & Red Star -->
  <g transform="translate(420, 95)">
    <rect width="320" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Red Constructivist Star -->
    <polygon points="160,25 178,75 230,75 188,105 204,155 160,125 116,155 132,105 90,75 142,75" fill="#dc2626"/>
    <circle cx="160" cy="90" r="16" fill="#1e293b"/>
    <circle cx="160" cy="90" r="12" fill="#fbbf24"/>

    <!-- Typographic Agitprop Banner -->
    <rect x="30" y="165" width="260" height="36" fill="#000000" stroke="#dc2626" stroke-width="1.5"/>
    <text x="160" y="189" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2">VICTORY THROUGH PRODUCTION</text>
    <text x="160" y="222" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Rodchenko &#8226; El Lissitzky &#8226; Jean Carlu</text>
  </g>

  <!-- Bottom Feature Strip -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="680" height="140" rx="10" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#f87171">KEY 1940s DESIGN CHARACTERISTICS</text>
      <text x="0" y="40" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
        <tspan x="0" dy="0">&#8226; Aggressive 45-degree diagonal compositions commanding instant visceral urgency</tspan>
        <tspan x="0" dy="18">&#8226; High-contrast 3-color palette: Primary Patriotic Red, Industrial Charcoal &amp; Deep Navy</tspan>
        <tspan x="0" dy="18">&#8226; Heavy industrial stencil &amp; condensed gothic grotesques with zero decorative serif flourishes</tspan>
        <tspan x="0" dy="18">&#8226; Seeds of Midcentury Modernism: simplification of human anatomy into powerful symbolic icons</tspan>
      </text>
    </g>

    <!-- Swatches -->
    <g transform="translate(520, 35)">
      <circle cx="15" cy="15" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="50" cy="15" r="14" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="85" cy="15" r="14" fill="#eab308" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="120" cy="15" r="14" fill="#18181b" stroke="#ffffff" stroke-width="1.5"/>
      <text x="68" y="55" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#a1a1aa">Stencil &#8226; Franklin Gothic</text>
    </g>
  </g>
</svg>