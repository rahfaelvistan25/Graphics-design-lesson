<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="groovyRainbow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="33%" stop-color="#ea580c"/>
      <stop offset="66%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bg7)"/>

  <!-- Top Title -->
  <g transform="translate(60, 35)">
    <rect width="270" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="16" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f59e0b" letter-spacing="1.5">1970s DUALITY: PUNK &amp; GROOVY</text>
    <text x="300" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">DIY Xerox Cut-and-Paste Rebellion vs. Earthy Warm Funk</text>
  </g>

  <!-- Left: Jamie Reid Punk Ransom Note Typography (Sex Pistols Tribute) -->
  <g transform="translate(60, 85)">
    <!-- Distressed Xerox Poster Frame -->
    <rect width="320" height="330" rx="6" fill="#18181b" stroke="#f43f5e" stroke-width="2"/>
    
    <!-- Halftone Xerox Grunge Noise Lines -->
    <g stroke="#3f3f46" stroke-width="0.8" opacity="0.4">
      <line x1="10" y1="50" x2="310" y2="50"/>
      <line x1="10" y1="110" x2="310" y2="110"/>
      <line x1="10" y1="170" x2="310" y2="170"/>
      <line x1="10" y1="230" x2="310" y2="230"/>
    </g>

    <!-- Ransom Note Cutout Letters: P-U-N-K -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="55" height="65" fill="#f43f5e" transform="rotate(-6 27 32)"/>
      <text x="27" y="47" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#ffffff" transform="rotate(-6 27 32)">P</text>

      <rect x="65" y="5" width="55" height="60" fill="#ffffff" transform="rotate(8 92 35)"/>
      <text x="92" y="50" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="42" font-weight="900" fill="#000000" transform="rotate(8 92 35)">U</text>

      <rect x="130" y="0" width="55" height="65" fill="#facc15" transform="rotate(-4 157 32)"/>
      <text x="157" y="47" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#000000" transform="rotate(-4 157 32)">N</text>

      <rect x="195" y="5" width="55" height="60" fill="#38bdf8" transform="rotate(5 222 35)"/>
      <text x="222" y="50" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="42" font-weight="900" fill="#000000" transform="rotate(5 222 35)">K</text>
    </g>

    <!-- God Save The Queen Stornaway Tribute Banner -->
    <rect x="25" y="130" width="270" height="35" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <text x="160" y="153" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#ffffff">NEVER MIND THE BOLLOCKS</text>

    <!-- Safety Pin Icon & Zine Features -->
    <g transform="translate(30, 185)">
      <!-- Safety Pin Graphic -->
      <path d="M 20 20 L 70 20 A 10 10 0 0 1 80 30 L 80 35 A 10 10 0 0 1 70 45 L 30 45" fill="none" stroke="#e4e4e7" stroke-width="3"/>
      <circle cx="20" cy="20" r="8" fill="#e4e4e7"/>
      
      <text x="95" y="25" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f43f5e">JAMIE REID (1977)</text>
      <text x="95" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#d4d4d8">DIY photocopied fanzines,</text>
      <text x="95" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#d4d4d8">torn paper &amp; anti-establishment.</text>
    </g>

    <rect x="25" y="280" width="270" height="30" rx="4" fill="#27272a"/>
    <text x="160" y="300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">Cutouts &#8226; Halftones &#8226; Raw Xerox Ink</text>
  </g>

  <!-- Right: Groovy 70s Earth-Toned Funk & Cooper Black -->
  <g transform="translate(420, 85)">
    <rect width="320" height="330" rx="6" fill="#451a03" stroke="#b45309" stroke-width="2"/>
    
    <!-- Multi-Line Rainbow Groovy Waves -->
    <g fill="none" stroke-width="6">
      <path d="M 20 60 Q 160 130, 300 40" stroke="#f59e0b"/>
      <path d="M 20 72 Q 160 142, 300 52" stroke="#d97706"/>
      <path d="M 20 84 Q 160 154, 300 64" stroke="#b45309"/>
      <path d="M 20 96 Q 160 166, 300 76" stroke="#65a30d"/>
    </g>

    <!-- Cooper Black Bulky Bubble Lettering Tribute -->
    <text x="160" y="160" text-anchor="middle" font-family="'Cooper Black', 'Outfit', serif" font-size="42" font-weight="900" fill="#fef3c7" stroke="#78350f" stroke-width="2">GROOVY</text>
    <text x="160" y="195" text-anchor="middle" font-family="'Cooper Black', 'Outfit', serif" font-size="28" font-weight="900" fill="#f59e0b">DISCO &amp; FUNK</text>

    <!-- Milton Glaser I LOVE NY Tribute -->
    <g transform="translate(60, 220)">
      <rect width="200" height="45" rx="8" fill="#78350f" stroke="#b45309" stroke-width="1"/>
      <text x="35" y="30" font-family="'Cooper Black', serif" font-size="20" font-weight="bold" fill="#ffffff">I</text>
      <text x="65" y="30" font-size="22" fill="#ef4444">❤️</text>
      <text x="110" y="30" font-family="'Cooper Black', serif" font-size="20" font-weight="bold" fill="#ffffff">N Y</text>
      <text x="160" y="28" font-family="'Inter', sans-serif" font-size="9" fill="#fde68a">(1977)</text>
    </g>

    <!-- Warm 70s Earth Palette -->
    <g transform="translate(60, 285)">
      <circle cx="20" cy="15" r="12" fill="#65a30d" stroke="#ffffff" stroke-width="1"/>
      <circle cx="55" cy="15" r="12" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
      <circle cx="90" cy="15" r="12" fill="#ea580c" stroke="#ffffff" stroke-width="1"/>
      <circle cx="125" cy="15" r="12" fill="#78350f" stroke="#ffffff" stroke-width="1"/>
      <circle cx="160" cy="15" r="12" fill="#fef3c7" stroke="#ffffff" stroke-width="1"/>
      <text x="195" y="19" font-family="'Inter', sans-serif" font-size="10" fill="#fde68a">Earth Tones</text>
    </g>
  </g>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(60, 435)">
    <rect width="680" height="75" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
    <text x="24" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#f59e0b">THE 1970s IMPACT:</text>
    <text x="24" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#d6d3d1">
      Democratization of printing through cheap Xerox machines enabled youth subcultures to bypass established agencies, while mainstream advertising embraced comforting organic avocado-green and harvest-gold palettes amidst global economic turmoil.
    </text>
  </g>
</svg>