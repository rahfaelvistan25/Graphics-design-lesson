<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="70%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="silver2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bg2)"/>

  <!-- Ornate Art Deco Geometric Border -->
  <rect x="25" y="25" width="750" height="500" rx="8" fill="none" stroke="url(#gold2)" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="480" rx="4" fill="none" stroke="url(#gold2)" stroke-width="0.8" stroke-dasharray="4 2"/>
  
  <!-- Corner Art Deco Stepped Motifs -->
  <g stroke="url(#gold2)" stroke-width="1.5" fill="none">
    <!-- Top-Left Corner -->
    <path d="M 25 55 L 55 55 L 55 25"/>
    <path d="M 25 70 L 70 70 L 70 25"/>
    <!-- Top-Right Corner -->
    <path d="M 775 55 L 745 55 L 745 25"/>
    <path d="M 775 70 L 730 70 L 730 25"/>
    <!-- Bottom-Left Corner -->
    <path d="M 25 495 L 55 495 L 55 525"/>
    <path d="M 25 480 L 70 480 L 70 525"/>
    <!-- Bottom-Right Corner -->
    <path d="M 775 495 L 745 495 L 745 525"/>
    <path d="M 775 480 L 730 480 L 730 525"/>
  </g>

  <!-- Central Radiating Sunburst (The Zenith of Speed & Luxury) -->
  <g transform="translate(400, 230)" opacity="0.3" stroke="url(#gold2)" stroke-width="1">
    <line x1="0" y1="0" x2="-350" y2="-180"/>
    <line x1="0" y1="0" x2="-280" y2="-190"/>
    <line x1="0" y1="0" x2="-200" y2="-200"/>
    <line x1="0" y1="0" x2="-100" y2="-210"/>
    <line x1="0" y1="0" x2="0" y2="-210"/>
    <line x1="0" y1="0" x2="100" y2="-210"/>
    <line x1="0" y1="0" x2="200" y2="-200"/>
    <line x1="0" y1="0" x2="280" y2="-190"/>
    <line x1="0" y1="0" x2="350" y2="-180"/>
  </g>

  <!-- Centerpiece: Art Deco Chrysler Spire / Cassandre Locomotive Tribute -->
  <g transform="translate(400, 260)" filter="url(#glow2)">
    <!-- Stepped Ziggurat Base -->
    <polygon points="0,-160 30,-120 70,-70 120,20 160,110 -160,110 -120,20 -70,-70 -30,-120" fill="#1c1917" stroke="url(#gold2)" stroke-width="2"/>
    <polygon points="0,-140 20,-110 50,-65 90,20 130,100 -130,100 -90,20 -50,-65 -20,-110" fill="none" stroke="url(#gold2)" stroke-width="1" stroke-dasharray="6 3"/>
    
    <!-- Central Beam Spire -->
    <line x1="0" y1="-190" x2="0" y2="100" stroke="url(#gold2)" stroke-width="3"/>
    <circle cx="0" cy="-190" r="5" fill="#fef08a"/>

    <!-- Chevron Chevrons -->
    <path d="M -80 70 L 0 30 L 80 70" fill="none" stroke="url(#gold2)" stroke-width="2"/>
    <path d="M -60 40 L 0 0 L 60 40" fill="none" stroke="url(#gold2)" stroke-width="2"/>
    <path d="M -40 10 L 0 -30 L 40 10" fill="none" stroke="url(#gold2)" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 75)">
    <text x="0" y="0" text-anchor="middle" font-family="'Outfit', 'Broadway', serif" font-size="34" font-weight="900" fill="url(#gold2)" letter-spacing="8">ART DECO &amp; THE JAZZ AGE</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="3">1920s GEOMETRIC LUXURY &#8226; STREAMLINE SPEED &#8226; PARIS EXPO 1925</text>
  </g>

  <!-- Hallmark Specifications Cards -->
  <g transform="translate(60, 390)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#1c1917" stroke="url(#gold2)" stroke-width="1"/>
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="url(#gold2)">GEOMETRIC VIGOR</text>
    <text x="16" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#d6d3d1">
      <tspan x="16" dy="0">Stepped ziggurats, chevrons,</tspan>
      <tspan x="16" dy="16">sunbursts &amp; aerodynamic arches</tspan>
      <tspan x="16" dy="16">inspired by the Machine Age.</tspan>
    </text>

    <!-- Card 2 -->
    <rect x="240" y="0" width="200" height="100" rx="8" fill="#1c1917" stroke="url(#gold2)" stroke-width="1"/>
    <text x="256" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="url(#gold2)">ICONIC MASTERS</text>
    <text x="256" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#d6d3d1">
      <tspan x="256" dy="0">A.M. Cassandre (Nord Express),</tspan>
      <tspan x="256" dy="16">Tamara de Lempicka, E. McKnight</tspan>
      <tspan x="256" dy="16">Kauffer &amp; Metropolis (1927).</tspan>
    </text>

    <!-- Card 3: Color Swatches -->
    <rect x="480" y="0" width="200" height="100" rx="8" fill="#1c1917" stroke="url(#gold2)" stroke-width="1"/>
    <text x="496" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="url(#gold2)">PALETTE &amp; TYPE</text>
    <g transform="translate(496, 40)">
      <circle cx="12" cy="12" r="10" fill="#ca8a04" stroke="#ffffff" stroke-width="1"/>
      <circle cx="42" cy="12" r="10" fill="#0f172a" stroke="#ca8a04" stroke-width="1"/>
      <circle cx="72" cy="12" r="10" fill="#991b1b" stroke="#ffffff" stroke-width="1"/>
      <circle cx="102" cy="12" r="10" fill="#065f46" stroke="#ffffff" stroke-width="1"/>
      <circle cx="132" cy="12" r="10" fill="#f8fafc" stroke="#ca8a04" stroke-width="1"/>
      <text x="0" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Bifur &#8226; Peignot &#8226; Broadway &#8226; Futura</text>
    </g>
  </g>
</svg>