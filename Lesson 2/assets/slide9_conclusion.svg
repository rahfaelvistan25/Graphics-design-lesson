<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad9" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <linearGradient id="alchemyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#818cf8"/>
      <stop offset="66%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad9)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <rect width="200" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CONCLUSION · SYNTHESIS</text>
    <text x="220" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">The Grand Design Formula: Elements + Principles = Impact</text>
  </g>

  <!-- Left: The Visual Alchemy Formula -->
  <g transform="translate(40, 75)" filter="url(#shadow9)">
    <rect width="400" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="22" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">The Design Alchemy Equation</text>
    <text x="22" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">How raw building blocks turn into compelling communication</text>

    <!-- Formula Step 1: The 7 Elements (The Raw Ingredients) -->
    <g transform="translate(20, 70)">
      <rect width="360" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">STEP 1: THE 7 ELEMENTS (Raw Ingredients)</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">What you put on the canvas:</text>
      
      <!-- Badges -->
      <g transform="translate(14, 48)">
        <rect x="0" y="0" width="42" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
        <text x="21" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Line</text>

        <rect x="47" y="0" width="46" height="22" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="0.5"/>
        <text x="70" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Shape</text>

        <rect x="98" y="0" width="44" height="22" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="0.5"/>
        <text x="120" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Form</text>

        <rect x="147" y="0" width="46" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="0.5"/>
        <text x="170" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Space</text>

        <rect x="198" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="0.5"/>
        <text x="223" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Colour</text>

        <rect x="253" y="0" width="44" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.5"/>
        <text x="275" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Value</text>

        <rect x="302" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="0.5"/>
        <text x="327" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Texture</text>
      </g>
    </g>

    <!-- Plus Symbol -->
    <g transform="translate(190, 168)">
      <circle cx="10" cy="10" r="14" fill="#818cf8"/>
      <text x="10" y="15" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#0f172a">+</text>
    </g>

    <!-- Formula Step 2: The Principles (The Architectural Rules) -->
    <g transform="translate(20, 198)">
      <rect width="360" height="75" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#818cf8">STEP 2: THE PRINCIPLES (The Blueprint Rules)</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">How you organize the elements:</text>
      <text x="14" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">
        Balance • Contrast • Emphasis • Hierarchy • Unity • Rhythm
      </text>
    </g>

    <!-- Equals Symbol -->
    <g transform="translate(190, 285)">
      <circle cx="10" cy="10" r="14" fill="#c084fc"/>
      <text x="10" y="15" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#0f172a">=</text>
    </g>

    <!-- Formula Result: Visual Masterpiece -->
    <g transform="translate(20, 315)">
      <rect width="360" height="100" rx="8" fill="#0f172a" stroke="url(#alchemyGrad)" stroke-width="2"/>
      <text x="180" y="28" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="url(#alchemyGrad)">
        ENGAGING VISUAL MASTERPIECE
      </text>
      <text x="180" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0">
        World-class UI • Captivating Games • Memorable Brands
      </text>
      <text x="180" y="76" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">
        Clarity of communication + Emotional resonance
      </text>
    </g>
  </g>

  <!-- Right: The Designer's Critical Element Checklist -->
  <g transform="translate(460, 75)" filter="url(#shadow9)">
    <rect width="300" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">The 7 Elements Audit Checklist</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Ask yourself before shipping any project:</text>

    <!-- 7 Checklist items -->
    <g transform="translate(18, 70)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="7" fill="#38bdf8" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Line:</text>
        <text x="56" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Are sightlines guiding the user's eye?</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 36)">
        <circle cx="10" cy="10" r="7" fill="#818cf8" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#818cf8" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Shape:</text>
        <text x="68" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Are silhouettes immediately clear?</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 72)">
        <circle cx="10" cy="10" r="7" fill="#c084fc" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#c084fc" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Form:</text>
        <text x="62" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Does elevation &amp; shadow feel natural?</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 108)">
        <circle cx="10" cy="10" r="7" fill="#34d399" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#34d399" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Space:</text>
        <text x="68" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Is there enough white space to breathe?</text>
      </g>

      <!-- Item 5 -->
      <g transform="translate(0, 144)">
        <circle cx="10" cy="10" r="7" fill="#f43f5e" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Colour:</text>
        <text x="70" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Does palette evoke the target emotion?</text>
      </g>

      <!-- Item 6 -->
      <g transform="translate(0, 180)">
        <circle cx="10" cy="10" r="7" fill="#f59e0b" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Value:</text>
        <text x="64" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Does it pass the squint / grayscale test?</text>
      </g>

      <!-- Item 7 -->
      <g transform="translate(0, 216)">
        <circle cx="10" cy="10" r="7" fill="#06b6d4" fill-opacity="0.2"/>
        <polyline points="7,10 9,12 13,8" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="24" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Texture:</text>
        <text x="76" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Does tactile finish add sensory depth?</text>
      </g>
    </g>

    <!-- Quiz CTA button preview -->
    <g transform="translate(18, 350)">
      <rect width="264" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="132" y="24" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">READY TO TEST YOUR SKILLS?</text>
      <text x="132" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Take the Interactive Elements Quiz →</text>
    </g>
  </g>
</svg>
