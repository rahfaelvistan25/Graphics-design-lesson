<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="550"/>
    <line x1="150" y1="0" x2="150" y2="550"/>
    <line x1="250" y1="0" x2="250" y2="550"/>
    <line x1="350" y1="0" x2="350" y2="550"/>
    <line x1="450" y1="0" x2="450" y2="550"/>
    <line x1="550" y1="0" x2="550" y2="550"/>
    <line x1="650" y1="0" x2="650" y2="550"/>
    <line x1="750" y1="0" x2="750" y2="550"/>
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 30)">
    <rect width="210" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="15" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">THE 7 BUILDING BLOCKS</text>
    <text x="240" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">The DNA of every visual composition on Earth</text>
  </g>

  <!-- Analogy Box (Top Right) -->
  <g transform="translate(530, 25)" filter="url(#dropShadow)">
    <rect width="230" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">RECIPE ANALOGY:</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Elements = Raw Ingredients</text>
    <text x="16" y="58" font-family="'Inter', sans-serif" font-size="11" fill="#c084fc">Principles = Recipe &amp; Structure</text>
  </g>

  <!-- Central Visual: The Deconstructed Cube / Prism of 7 Elements -->
  <!-- 7 Interactive-looking Element Badges Arrayed Around a Central Design Node -->

  <!-- Center Master Hub -->
  <g transform="translate(400, 290)">
    <!-- Outer Glow Ring -->
    <circle r="90" fill="none" stroke="url(#glowLine)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <circle r="75" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    
    <text x="0" y="-12" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#f8fafc">VISUAL</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="url(#glowLine)">COMPOSITION</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Synthesized Whole</text>
  </g>

  <!-- Element 1: LINE -->
  <g transform="translate(80, 110)" filter="url(#dropShadow)">
    <rect width="180" height="85" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="20" y1="36" x2="40" y2="24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">01. LINE</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">Direction &amp; Contour</text>
    <!-- Visual mini demo -->
    <path d="M 20 65 Q 60 50, 100 65 T 160 65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Connecting line to center -->
    <line x1="180" y1="50" x2="330" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Element 2: SHAPE -->
  <g transform="translate(310, 95)" filter="url(#dropShadow)">
    <rect width="180" height="85" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#818cf8" fill-opacity="0.2"/>
    <polygon points="30,19 40,37 20,37" fill="#818cf8"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">02. SHAPE</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#818cf8">2D Boundary &amp; Area</text>
    <!-- Mini icons -->
    <rect x="22" y="58" width="16" height="16" rx="3" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="65" cy="66" r="8" fill="#818cf8" fill-opacity="0.4"/>
    <path d="M 95 68 C 95 60, 115 60, 115 68 Z" fill="#818cf8" fill-opacity="0.4"/>
    <text x="125" y="70" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">2D Flat</text>
    <line x1="400" y1="180" x2="400" y2="215" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Element 3: FORM -->
  <g transform="translate(540, 110)" filter="url(#dropShadow)">
    <rect width="180" height="85" rx="12" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#c084fc" fill-opacity="0.2"/>
    <!-- 3D Cube Icon -->
    <path d="M 30 18 L 40 23 L 30 28 L 20 23 Z" fill="#c084fc"/>
    <path d="M 20 23 L 30 28 L 30 39 L 20 34 Z" fill="#9333ea"/>
    <path d="M 40 23 L 30 28 L 30 39 L 40 34 Z" fill="#a855f7"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">03. FORM</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#c084fc">3D Volume &amp; Depth</text>
    <!-- Visual mini 3D sphere -->
    <circle cx="35" cy="66" r="10" fill="url(#glowLine)"/>
    <text x="56" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Length × Width × Depth</text>
    <line x1="540" y1="170" x2="470" y2="240" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Element 4: SPACE -->
  <g transform="translate(60, 245)" filter="url(#dropShadow)">
    <rect width="180" height="85" rx="12" fill="url(#cardGrad1)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#34d399" fill-opacity="0.2"/>
    <rect x="23" y="23" width="14" height="14" rx="2" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">04. SPACE</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#34d399">Positive &amp; Negative</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">White Space &amp; Breathing Room</text>
    <line x1="240" y1="285" x2="310" y2="290" stroke="#34d399" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Element 5: COLOUR -->
  <g transform="translate(560, 245)" filter="url(#dropShadow)">
    <rect width="180" height="85" rx="12" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#f43f5e" fill-opacity="0.2"/>
    <!-- Color Wheel Palette icon -->
    <circle cx="26" cy="26" r="3" fill="#f43f5e"/>
    <circle cx="34" cy="26" r="3" fill="#38bdf8"/>
    <circle cx="30" cy="34" r="3" fill="#fbbf24"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">05. COLOUR</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#f43f5e">Hue, Saturation &amp; Emotion</text>
    <!-- Mini color bar -->
    <rect x="20" y="60" width="22" height="12" rx="2" fill="#ef4444"/>
    <rect x="46" y="60" width="22" height="12" rx="2" fill="#f59e0b"/>
    <rect x="72" y="60" width="22" height="12" rx="2" fill="#10b981"/>
    <rect x="98" y="60" width="22" height="12" rx="2" fill="#3b82f6"/>
    <rect x="124" y="60" width="22" height="12" rx="2" fill="#8b5cf6"/>
    <line x1="560" y1="285" x2="490" y2="290" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Element 6: VALUE -->
  <g transform="translate(140, 395)" filter="url(#dropShadow)">
    <rect width="210" height="90" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M 30 18 A 12 12 0 0 1 30 42 Z" fill="#f59e0b"/>
    <circle cx="30" cy="30" r="12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">06. VALUE</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#f59e0b">Lightness vs Darkness</text>
    <!-- 5 step value ramp -->
    <rect x="20" y="60" width="30" height="14" rx="2" fill="#ffffff"/>
    <rect x="54" y="60" width="30" height="14" rx="2" fill="#cbd5e1"/>
    <rect x="88" y="60" width="30" height="14" rx="2" fill="#64748b"/>
    <rect x="122" y="60" width="30" height="14" rx="2" fill="#334155"/>
    <rect x="156" y="60" width="30" height="14" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <line x1="280" y1="395" x2="340" y2="350" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Element 7: TEXTURE -->
  <g transform="translate(460, 395)" filter="url(#dropShadow)">
    <rect width="210" height="90" rx="12" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#06b6d4" fill-opacity="0.2"/>
    <!-- Texture Hatching Icon -->
    <line x1="22" y1="36" x2="36" y2="22" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="26" y1="40" x2="40" y2="26" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="18" y1="32" x2="32" y2="18" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="56" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff">07. TEXTURE</text>
    <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#06b6d4">Surface Tactile Quality</text>
    <!-- Visual sample -->
    <rect x="20" y="60" width="166" height="16" rx="4" fill="#0e7490" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="32" y="72" font-family="'Inter', sans-serif" font-size="10" fill="#a5f3fc">Visual Tactility &amp; Digital Grain</text>
    <line x1="520" y1="395" x2="460" y2="350" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  </g>

  <!-- Bottom Annotation Banner -->
  <g transform="translate(180, 505)">
    <rect width="440" height="30" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="220" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      Every visual interface, video game asset, and artwork is built by combining these 7 Elements.
    </text>
  </g>
</svg>
