<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="dynamicGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad2)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <rect width="180" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">ELEMENT 01 · LINE</text>
    <text x="200" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Direction, Psychological Resonance, and Spatial Guidance</text>
  </g>

  <!-- Panel 1: The 5 Fundamental Line Directions (Left column) -->
  <g transform="translate(40, 75)" filter="url(#shadow2)">
    <rect width="345" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Directional Psychology of Lines</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">How orientation directly impacts human emotion</text>

    <!-- 1. Horizontal -->
    <g transform="translate(20, 68)">
      <rect width="305" height="58" rx="8" fill="#1e293b" fill-opacity="0.6"/>
      <line x1="16" y1="29" x2="110" y2="29" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <text x="125" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Horizontal</text>
      <text x="125" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Calm, stability, tranquility (e.g. Horizons, floor lines)</text>
    </g>

    <!-- 2. Vertical -->
    <g transform="translate(20, 136)">
      <rect width="305" height="58" rx="8" fill="#1e293b" fill-opacity="0.6"/>
      <line x1="60" y1="10" x2="60" y2="48" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <text x="125" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#10b981">Vertical</text>
      <text x="125" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Strength, dignity, authority (e.g. Pillars, trees, skyscrapers)</text>
    </g>

    <!-- 3. Diagonal -->
    <g transform="translate(20, 204)">
      <rect width="305" height="58" rx="8" fill="#1e293b" fill-opacity="0.6"/>
      <line x1="20" y1="44" x2="100" y2="14" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <polygon points="104,12 94,13 99,20" fill="#f59e0b"/>
      <text x="125" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Diagonal</text>
      <text x="125" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Dynamism, speed, tension, action (e.g. Speed lines, slopes)</text>
    </g>

    <!-- 4. Curved -->
    <g transform="translate(20, 272)">
      <rect width="305" height="58" rx="8" fill="#1e293b" fill-opacity="0.6"/>
      <path d="M 18 36 Q 45 10, 65 30 T 110 22" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <text x="125" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#c084fc">Curved &amp; Organic</text>
      <text x="125" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Grace, natural flow, rhythm, comfort (e.g. Waves, anatomy)</text>
    </g>

    <!-- 5. Zigzag / Jagged -->
    <g transform="translate(20, 340)">
      <rect width="305" height="58" rx="8" fill="#1e293b" fill-opacity="0.6"/>
      <polyline points="18,30 35,12 52,42 70,12 88,42 105,24" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f43f5e">Zig-Zag / Chaotic</text>
      <text x="125" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Danger, excitement, electrical shock, aggressive energy</text>
    </g>

    <!-- Implied Line note at bottom -->
    <g transform="translate(20, 406)">
      <line x1="5" y1="12" x2="95" y2="12" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="110" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Implied Line: Dotted cues guide gaze unconsciously</text>
    </g>
  </g>

  <!-- Panel 2: Line Weight & Digital UI Architecture (Right column) -->
  <g transform="translate(415, 75)" filter="url(#shadow2)">
    <rect width="345" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Line Weight &amp; Digital UI Hierarchy</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Stroke weight commands visual focal priority</text>

    <!-- Stroke Weight Hierarchy Demo -->
    <g transform="translate(20, 68)">
      <rect width="305" height="120" rx="8" fill="#1e293b" fill-opacity="0.6"/>
      
      <!-- 1px -->
      <line x1="20" y1="24" x2="160" y2="24" stroke="#94a3b8" stroke-width="1"/>
      <text x="180" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">1px · Hairline / Subtle Grid</text>

      <!-- 2px -->
      <line x1="20" y1="48" x2="160" y2="48" stroke="#38bdf8" stroke-width="2"/>
      <text x="180" y="52" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">2px · Standard UI Border</text>

      <!-- 4px -->
      <line x1="20" y1="74" x2="160" y2="74" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
      <text x="180" y="78" font-family="'Inter', sans-serif" font-size="10" fill="#818cf8">4px · Focus Indicator / Accent</text>

      <!-- 8px -->
      <line x1="20" y1="102" x2="160" y2="102" stroke="#c084fc" stroke-width="8" stroke-linecap="round"/>
      <text x="180" y="106" font-family="'Inter', sans-serif" font-size="10" fill="#c084fc">8px · Heavy Anchor / Progress</text>
    </g>

    <!-- UI Wireframe Application Example -->
    <g transform="translate(20, 204)">
      <rect width="305" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Lines as Digital Scaffolding</text>
      <text x="15" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Navigation bar, column dividers &amp; trajectory paths</text>

      <!-- Wireframe UI inside box -->
      <g transform="translate(15, 50)">
        <!-- App Header Bar with line -->
        <rect width="275" height="24" rx="4" fill="#1e293b"/>
        <line x1="10" y1="12" x2="40" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <line x1="210" y1="12" x2="265" y2="12" stroke="#64748b" stroke-width="1.5"/>
        <line x1="0" y1="24" x2="275" y2="24" stroke="#38bdf8" stroke-width="1.5"/>

        <!-- 2 Column Dividers -->
        <line x1="85" y1="34" x2="85" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
        
        <!-- Left Nav skeleton lines -->
        <line x1="10" y1="46" x2="65" y2="46" stroke="#94a3b8" stroke-width="2"/>
        <line x1="10" y1="62" x2="55" y2="62" stroke="#475569" stroke-width="1.5"/>
        <line x1="10" y1="78" x2="60" y2="78" stroke="#475569" stroke-width="1.5"/>
        <line x1="10" y1="94" x2="50" y2="94" stroke="#475569" stroke-width="1.5"/>

        <!-- Main Chart Lines -->
        <path d="M 98 120 L 130 90 L 170 105 L 210 60 L 260 75" fill="none" stroke="url(#dynamicGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Chart baseline -->
        <line x1="98" y1="135" x2="265" y2="135" stroke="#475569" stroke-width="1"/>
        <line x1="98" y1="50" x2="98" y2="135" stroke="#475569" stroke-width="1"/>

        <!-- Sightline arrow -->
        <line x1="210" y1="60" x2="245" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>
        <circle cx="210" cy="60" r="4" fill="#f59e0b"/>
        <text x="215" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#f59e0b">Focal Spike</text>
      </g>
    </g>
  </g>
</svg>
