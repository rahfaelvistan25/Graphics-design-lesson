<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad7" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad7)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <rect width="180" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">ELEMENT 06 · VALUE</text>
    <text x="200" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Luminance, The 9-Step Gray Scale, High-Key vs. Low-Key &amp; UI Elevation</text>
  </g>

  <!-- Left Panel: The 9-Step Value Scale & The Squint Test -->
  <g transform="translate(40, 75)" filter="url(#shadow7)">
    <rect width="360" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">The 9-Step Tonal Value Scale</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Pure White (Value 1) to Maximum Black (Value 9)</text>

    <!-- The 9 steps stacked vertically -->
    <g transform="translate(20, 68)">
      <!-- 1 White -->
      <rect x="0" y="0" width="320" height="24" rx="4" fill="#ffffff"/>
      <text x="12" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#000000">Step 1 · Pure White (100% Light)</text>
      <text x="290" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#000000">100%</text>

      <!-- 2 -->
      <rect x="0" y="27" width="320" height="24" rx="4" fill="#e2e8f0"/>
      <text x="12" y="43" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0f172a">Step 2 · High Light</text>
      <text x="295" y="43" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0f172a">88%</text>

      <!-- 3 -->
      <rect x="0" y="54" width="320" height="24" rx="4" fill="#cbd5e1"/>
      <text x="12" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0f172a">Step 3 · Light</text>
      <text x="295" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0f172a">75%</text>

      <!-- 4 -->
      <rect x="0" y="81" width="320" height="24" rx="4" fill="#94a3b8"/>
      <text x="12" y="97" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0f172a">Step 4 · Low Light</text>
      <text x="295" y="97" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0f172a">62%</text>

      <!-- 5 Midtone -->
      <rect x="0" y="108" width="320" height="24" rx="4" fill="#64748b"/>
      <text x="12" y="124" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Step 5 · Mid-Gray (Neutral 50%)</text>
      <text x="295" y="124" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">50%</text>

      <!-- 6 -->
      <rect x="0" y="135" width="320" height="24" rx="4" fill="#475569"/>
      <text x="12" y="151" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Step 6 · High Dark</text>
      <text x="295" y="151" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">38%</text>

      <!-- 7 -->
      <rect x="0" y="162" width="320" height="24" rx="4" fill="#334155"/>
      <text x="12" y="178" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Step 7 · Dark</text>
      <text x="295" y="178" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">25%</text>

      <!-- 8 -->
      <rect x="0" y="189" width="320" height="24" rx="4" fill="#1e293b"/>
      <text x="12" y="205" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Step 8 · Low Dark</text>
      <text x="295" y="205" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">12%</text>

      <!-- 9 Black -->
      <rect x="0" y="216" width="320" height="24" rx="4" fill="#000000" stroke="#334155" stroke-width="1"/>
      <text x="12" y="232" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Step 9 · Pure Black (0% Light)</text>
      <text x="302" y="232" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">0%</text>
    </g>

    <!-- The Golden Art Law -->
    <g transform="translate(20, 335)">
      <rect width="320" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f59e0b">THE DESIGN LAW OF VALUE:</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">"Color gets the credit, but VALUE does the work!"</text>
      <text x="14" y="64" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">
        If you convert your design to grayscale and it cannot be read, your color choices are an illusion.
      </text>
    </g>
  </g>

  <!-- Right Panel: High-Key vs Low-Key & Dark Mode UI Elevation -->
  <g transform="translate(420, 75)" filter="url(#shadow7)">
    <rect width="340" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Tonal Atmosphere &amp; UI Elevation</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Emotional mood and dark-mode depth layering</text>

    <!-- High-Key vs Low-Key Mini Comparison -->
    <g transform="translate(20, 70)">
      <!-- High Key -->
      <g transform="translate(0, 0)">
        <rect width="145" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#0f172a">HIGH-KEY</text>
        <circle cx="72" cy="60" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
        <text x="72" y="98" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Mostly steps 1–4</text>
        <text x="72" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0284c7">Airy · Joyful · Clean</text>
      </g>

      <!-- Low Key -->
      <g transform="translate(155, 0)">
        <rect width="145" height="120" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
        <text x="10" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#f8fafc">LOW-KEY</text>
        <circle cx="72" cy="60" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="72" y="98" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Mostly steps 6–9</text>
        <text x="72" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#a855f7">Dramatic · Cyber · Mystery</text>
      </g>
    </g>

    <!-- Dark Mode Surface Elevation Guide -->
    <g transform="translate(20, 208)">
      <rect width="300" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Dark Mode Elevation = Value Stepping</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">In dark themes, higher objects reflect more ambient value</text>

      <!-- Elevation Levels -->
      <g transform="translate(14, 52)">
        <!-- Layer 0 Base Canvas -->
        <rect x="0" y="0" width="272" height="34" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="21" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Z-0: Canvas Background (#090D16 · Value 9)</text>

        <!-- Layer 1 Card -->
        <rect x="15" y="44" width="242" height="34" rx="6" fill="#131c2e" stroke="#334155" stroke-width="1"/>
        <text x="27" y="65" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Z-1: Surface Card (#131C2E · Value 8)</text>

        <!-- Layer 2 Modal / Dropdown -->
        <rect x="30" y="88" width="212" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="42" y="109" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Z-2: Modal Dialog (#1E293B · Value 7)</text>
      </g>

      <text x="14" y="195" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">
        Lighter values create natural perceived physical height!
      </text>
    </g>
  </g>
</svg>
