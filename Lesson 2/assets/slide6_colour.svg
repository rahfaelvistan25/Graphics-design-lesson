<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad6)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <rect width="180" height="28" rx="14" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f43f5e" letter-spacing="1">ELEMENT 05 · COLOUR</text>
    <text x="200" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Hue, Saturation, Harmonies, Temperature &amp; Psychological Perception</text>
  </g>

  <!-- Left Panel: 12-Hue Color Wheel with Harmonies -->
  <g transform="translate(40, 75)" filter="url(#shadow6)">
    <rect width="360" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">The 12-Segment Colour Wheel</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Complementary, Analogous &amp; Triadic relationships</text>

    <!-- Color Wheel Center -->
    <g transform="translate(180, 200)">
      <!-- Outer ring segments (12 petals) -->
      <!-- Red (0 deg) -->
      <path d="M 0 -85 A 85 85 0 0 1 42 -73 L 25 -43 A 50 50 0 0 0 0 -50 Z" fill="#ef4444"/>
      <!-- Red-Orange (30 deg) -->
      <path d="M 42 -73 A 85 85 0 0 1 73 -42 L 43 -25 A 50 50 0 0 0 25 -43 Z" fill="#f97316"/>
      <!-- Orange (60 deg) -->
      <path d="M 73 -42 A 85 85 0 0 1 85 0 L 50 0 A 50 50 0 0 0 43 -25 Z" fill="#f59e0b"/>
      <!-- Yellow-Orange (90 deg) -->
      <path d="M 85 0 A 85 85 0 0 1 73 42 L 43 25 A 50 50 0 0 0 50 0 Z" fill="#eab308"/>
      <!-- Yellow (120 deg) -->
      <path d="M 73 42 A 85 85 0 0 1 42 73 L 25 43 A 50 50 0 0 0 43 25 Z" fill="#84cc16"/>
      <!-- Yellow-Green (150 deg) -->
      <path d="M 42 73 A 85 85 0 0 1 0 85 L 0 50 A 50 50 0 0 0 25 43 Z" fill="#22c55e"/>
      <!-- Green (180 deg) -->
      <path d="M 0 85 A 85 85 0 0 1 -42 73 L -25 43 A 50 50 0 0 0 0 50 Z" fill="#10b981"/>
      <!-- Blue-Green (210 deg) -->
      <path d="M -42 73 A 85 85 0 0 1 -73 42 L -43 25 A 50 50 0 0 0 -25 43 Z" fill="#06b6d4"/>
      <!-- Blue (240 deg) -->
      <path d="M -73 42 A 85 85 0 0 1 -85 0 L -50 0 A 50 50 0 0 0 -43 25 Z" fill="#3b82f6"/>
      <!-- Blue-Violet (270 deg) -->
      <path d="M -85 0 A 85 85 0 0 1 -73 -42 L -43 -25 A 50 50 0 0 0 -50 0 Z" fill="#6366f1"/>
      <!-- Violet (300 deg) -->
      <path d="M -73 -42 A 85 85 0 0 1 -42 -73 L -25 -43 A 50 50 0 0 0 -43 -25 Z" fill="#a855f7"/>
      <!-- Red-Violet (330 deg) -->
      <path d="M -42 -73 A 85 85 0 0 1 0 -85 L 0 -50 A 50 50 0 0 0 -25 -43 Z" fill="#ec4899"/>

      <!-- Center Inner Hub -->
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#ffffff">COLOR</text>
      <text x="0" y="10" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#94a3b8">WHEEL</text>

      <!-- Complementary indicator line (Red vs Cyan/Green) -->
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="-65" r="4" fill="#ffffff"/>
      <circle cx="0" cy="65" r="4" fill="#ffffff"/>
    </g>

    <!-- Harmony Schemes Badges -->
    <g transform="translate(20, 315)">
      <rect width="320" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Complementary -->
      <g transform="translate(12, 16)">
        <circle cx="6" cy="6" r="6" fill="#ef4444"/>
        <circle cx="20" cy="6" r="6" fill="#10b981"/>
        <text x="34" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Complementary:</text>
        <text x="135" y="10" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Opposite hues (max contrast)</text>
      </g>

      <!-- Analogous -->
      <g transform="translate(12, 44)">
        <circle cx="6" cy="6" r="6" fill="#3b82f6"/>
        <circle cx="18" cy="6" r="6" fill="#06b6d4"/>
        <circle cx="30" cy="6" r="6" fill="#10b981"/>
        <text x="44" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Analogous:</text>
        <text x="120" y="10" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Side-by-side hues (serene)</text>
      </g>

      <!-- Triadic -->
      <g transform="translate(12, 72)">
        <circle cx="6" cy="6" r="6" fill="#f59e0b"/>
        <circle cx="18" cy="6" r="6" fill="#3b82f6"/>
        <circle cx="30" cy="6" r="6" fill="#ec4899"/>
        <text x="44" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Triadic:</text>
        <text x="100" y="10" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Equally spaced triangle (vibrant)</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: The 3 Properties of Colour & Temperature -->
  <g transform="translate(420, 75)" filter="url(#shadow6)">
    <rect width="340" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">The 3 Properties &amp; Temperature</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Hue · Saturation · Value</text>

    <!-- 1. HUE -->
    <g transform="translate(20, 70)">
      <rect width="300" height="52" rx="8" fill="#1e293b"/>
      <text x="12" y="18" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. HUE (The pure color wavelength)</text>
      <g transform="translate(12, 26)">
        <rect x="0" y="0" width="44" height="16" rx="3" fill="#ef4444"/>
        <rect x="48" y="0" width="44" height="16" rx="3" fill="#f59e0b"/>
        <rect x="96" y="0" width="44" height="16" rx="3" fill="#10b981"/>
        <rect x="144" y="0" width="44" height="16" rx="3" fill="#3b82f6"/>
        <rect x="192" y="0" width="44" height="16" rx="3" fill="#a855f7"/>
        <rect x="240" y="0" width="36" height="16" rx="3" fill="#ec4899"/>
      </g>
    </g>

    <!-- 2. SATURATION -->
    <g transform="translate(20, 134)">
      <rect width="300" height="52" rx="8" fill="#1e293b"/>
      <text x="12" y="18" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f43f5e">2. SATURATION (Intensity / Purity)</text>
      <!-- Gradient from 100% saturation to 0% gray -->
      <g transform="translate(12, 26)">
        <rect x="0" y="0" width="276" height="16" rx="3" fill="url(#satRamp)" stroke="#475569" stroke-width="0.5"/>
      </g>
    </g>
    <defs>
      <linearGradient id="satRamp" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="50%" stop-color="#64748b"/>
        <stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>
    </defs>

    <!-- 3. TEMPERATURE -->
    <g transform="translate(20, 198)">
      <rect width="300" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Colour Temperature Psychology</text>
      
      <!-- Warm -->
      <g transform="translate(12, 34)">
        <rect width="130" height="58" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
        <text x="10" y="18" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#fb923c">WARM (Red, Orange)</text>
        <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#fed7aa">Advances toward viewer.</text>
        <text x="10" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#fed7aa">Energy, hunger, urgency.</text>
      </g>

      <!-- Cool -->
      <g transform="translate(155, 34)">
        <rect width="130" height="58" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
        <text x="10" y="18" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">COOL (Blue, Teal)</text>
        <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#bae6fd">Recedes into background.</text>
        <text x="10" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#bae6fd">Trust, calm, intellect.</text>
      </g>
    </g>

    <!-- Digital Color System Callout -->
    <g transform="translate(20, 315)">
      <rect width="300" height="105" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">The 60-30-10 Interior/UI Rule</text>
      
      <g transform="translate(12, 36)">
        <rect x="0" y="0" width="165" height="18" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="82" y="13" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">60% Dominant (Canvas / Dark)</text>
        
        <rect x="170" y="0" width="75" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="207" y="13" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#94a3b8">30% Secondary</text>

        <rect x="250" y="0" width="26" height="18" rx="3" fill="#f43f5e"/>
        <text x="263" y="13" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#ffffff">10%</text>
      </g>

      <text x="12" y="80" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">
        Keep 10% for the high-contrast accent/CTA button. If everything is colorful, nothing stands out!
      </text>
    </g>
  </g>
</svg>
