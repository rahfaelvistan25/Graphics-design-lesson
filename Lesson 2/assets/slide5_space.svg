<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad5)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <rect width="180" height="28" rx="14" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">ELEMENT 04 · SPACE</text>
    <text x="200" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Positive vs. Negative Space: Figure-Ground Dynamics &amp; Visual Breathing Room</text>
  </g>

  <!-- Left Panel: Figure-Ground Dynamic (Rubin's Vase Concept) -->
  <g transform="translate(40, 75)" filter="url(#shadow5)">
    <rect width="345" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Positive vs. Negative Space</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">The background is just as active as the foreground</text>

    <!-- Figure-Ground Illusion Graphic -->
    <g transform="translate(32, 75)">
      <!-- Outer frame -->
      <rect width="280" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Black background represents negative space -->
      <!-- White central vase / Two facing blue profiles -->
      <!-- Left profile in cyan -->
      <path d="M 40 25 C 75 25, 75 55, 65 75 C 55 95, 80 105, 80 115 C 80 125, 60 135, 65 155 C 70 175, 50 195, 40 205 L 40 25 Z" fill="#38bdf8"/>
      <!-- Right profile in cyan -->
      <path d="M 240 25 C 205 25, 205 55, 215 75 C 225 95, 200 105, 200 115 C 200 125, 220 135, 215 155 C 210 175, 230 195, 240 205 L 240 25 Z" fill="#38bdf8"/>
      
      <!-- Center negative space creates a Goblet/Vase -->
      <circle cx="140" cy="50" r="14" fill="#ffffff" fill-opacity="0.1"/>

      <!-- Label overlays -->
      <text x="50" y="118" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0f172a">FACE</text>
      <text x="210" y="118" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0f172a">FACE</text>
      <text x="140" y="120" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffffff">VASE</text>
    </g>

    <!-- Annotations below -->
    <g transform="translate(20, 325)">
      <rect width="305" height="42" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="21" r="8" fill="#38bdf8"/>
      <text x="38" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Positive Space (The Figure)</text>
      <text x="38" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">The tangible subjects demanding focus.</text>
    </g>

    <g transform="translate(20, 375)">
      <rect width="305" height="42" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="21" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
      <text x="38" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Negative Space (The Ground)</text>
      <text x="38" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Empty space framing &amp; shaping the subject.</text>
    </g>
  </g>

  <!-- Right Panel: Macro vs Micro White Space & Luxury UI -->
  <g transform="translate(415, 75)" filter="url(#shadow5)">
    <rect width="345" height="440" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">White Space in Digital UI</text>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Empty space equals cognitive luxury and calm</text>

    <!-- Comparison: Cramped vs Spacious UI -->
    <!-- Bad cramped UI -->
    <g transform="translate(20, 72)">
      <rect width="145" height="180" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="20" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#ef4444">0% WHITE SPACE</text>
      <!-- Crammed elements -->
      <rect x="8" y="28" width="129" height="16" fill="#f87171" fill-opacity="0.2"/>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="8" fill="#f87171">BUY NOW SALE 50% OFF!</text>
      <rect x="8" y="48" width="60" height="26" fill="#334155"/>
      <rect x="72" y="48" width="65" height="26" fill="#334155"/>
      <rect x="8" y="78" width="129" height="34" fill="#1e293b"/>
      <text x="12" y="92" font-family="'Inter', sans-serif" font-size="7" fill="#cbd5e1">Huge text block with zero margins</text>
      <text x="12" y="103" font-family="'Inter', sans-serif" font-size="7" fill="#cbd5e1">or padding suffocating eyes.</text>
      <rect x="8" y="116" width="129" height="22" fill="#ef4444"/>
      <text x="72" y="131" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff">CLICK ME NOW</text>
      <rect x="8" y="142" width="129" height="30" fill="#1e293b"/>
      <text x="72" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#ef4444">High Cognitive Friction</text>
    </g>

    <!-- Luxury spacious UI -->
    <g transform="translate(180, 72)">
      <rect width="145" height="180" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="10" y="20" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#34d399">65% WHITE SPACE</text>
      <!-- Generous breathing room -->
      <text x="72" y="48" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Visionary</text>
      <text x="72" y="64" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Pure form meets clarity.</text>
      
      <!-- Minimalist elegant device icon -->
      <circle cx="72" cy="100" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Elegant button with generous padding -->
      <rect x="30" y="132" width="85" height="24" rx="12" fill="#34d399"/>
      <text x="72" y="147" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0f172a">Explore</text>
      <text x="72" y="170" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#34d399">Calm &amp; Premium</text>
    </g>

    <!-- Macro vs Micro Space definition -->
    <g transform="translate(20, 268)">
      <rect width="305" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Macro vs. Micro White Space</text>
      
      <g transform="translate(14, 40)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34d399">• Macro Space:</text>
        <text x="0" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">The large empty gaps between layout sections, margins, and content cards.</text>
      </g>

      <g transform="translate(14, 85)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#818cf8">• Micro Space:</text>
        <text x="0" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">The tiny gaps between letters (kerning), lines of text (leading), and icon paddings.</text>
      </g>
    </g>
  </g>
</svg>
