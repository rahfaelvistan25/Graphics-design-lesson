<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad11" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad11)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="250" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TIPS &#183; 5.1, 5.2 &amp; 5.3</text>
    <text x="280" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Layering, Horizon Line &amp; Unusual POV</text>
  </g>

  <!-- 3 Column Panels -->

  <!-- Panel 1: 5.1 LAYERING -->
  <g transform="translate(40, 85)" filter="url(#shadow11)">
    <rect width="225" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="42" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">5.1 LAYERING &amp; OCCLUSION</text>

    <!-- Visual: 3 Overlapping cards with shadows & translucent blur -->
    <g transform="translate(15, 55)">
      <rect width="195" height="150" rx="8" fill="#1e293b"/>

      <!-- Layer 1: Back -->
      <rect x="25" y="20" width="100" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="35" y="45" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b">Layer 1 (Back)</text>

      <!-- Layer 2: Mid (Overlapping Layer 1) -->
      <g filter="url(#shadow11)">
        <rect x="55" y="45" width="105" height="75" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="65" y="70" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Layer 2 (Hero)</text>
      </g>

      <!-- Layer 3: Front Glass Cutout (Overlapping Layer 2) -->
      <g filter="url(#shadow11)">
        <rect x="90" y="75" width="90" height="60" rx="6" fill="#0284c7" fill-opacity="0.5" stroke="#ffffff" stroke-width="1.5"/>
        <text x="100" y="105" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Layer 3 (Front)</text>
      </g>

      <text x="25" y="142" font-family="'Inter', sans-serif" font-size="8.5" fill="#38bdf8">&#10024; Occlusion proves spatial depth</text>
    </g>

    <g transform="translate(15, 220)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Why Layering Works:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Partial overlap (occlusion) instantly resolves 3D depth</text>
      <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Connects disparate elements into a cohesive stage</text>
      <text x="0" y="82" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Used heavily in modern glassmorphic UI cards</text>
    </g>
  </g>

  <!-- Panel 2: 5.2 HORIZON LINE -->
  <g transform="translate(285, 85)" filter="url(#shadow11)">
    <rect width="225" height="340" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="42" rx="12" fill="#d97706" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#fbbf24">5.2 HORIZON LINE SHIFT</text>

    <!-- Visual: Low Horizon vs High Horizon Diagram -->
    <g transform="translate(15, 55)">
      <rect width="195" height="150" rx="8" fill="#1e293b"/>

      <!-- Low Horizon (Heroic, Epic Sky, Monumental) -->
      <g transform="translate(10, 10)">
        <rect width="80" height="120" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
        <line x1="0" y1="95" x2="80" y2="95" stroke="#fbbf24" stroke-width="1.5"/>
        <polygon points="40,25 60,95 20,95" fill="#f59e0b"/>
        <text x="12" y="112" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#fbbf24">LOW HORIZON</text>
        <text x="10" y="20" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8">Epic Sky &amp; Scale</text>
      </g>

      <!-- High Horizon (Grounded, Intimate Land Details, Panorama) -->
      <g transform="translate(105, 10)">
        <rect width="80" height="120" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <line x1="0" y1="30" x2="80" y2="30" stroke="#38bdf8" stroke-width="1.5"/>
        <polygon points="40,30 20,90 60,90" fill="#38bdf8" opacity="0.7"/>
        <circle cx="40" cy="70" r="10" fill="#fef08a"/>
        <text x="8" y="112" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#38bdf8">HIGH HORIZON</text>
        <text x="8" y="22" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8">Terrain &amp; Detail</text>
      </g>

      <text x="35" y="142" font-family="'Inter', sans-serif" font-size="8.5" fill="#f8fafc">Never bisect exactly at 50%</text>
    </g>

    <g transform="translate(15, 220)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Psychological Altitude:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Low Horizon: Emphasizes sky, towering scale &amp; awe</text>
      <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; High Horizon: Emphasizes landscape, pathways &amp; ground</text>
      <text x="0" y="82" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Dead-center 50% horizon cuts picture in half statically</text>
    </g>
  </g>

  <!-- Panel 3: 5.3 UNUSUAL POINT OF VIEW -->
  <g transform="translate(530, 85)" filter="url(#shadow11)">
    <rect width="230" height="340" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="42" rx="12" fill="#9333ea" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#c084fc">5.3 UNUSUAL POV (ANGLES)</text>

    <!-- Visual: Worm's Eye vs Bird's Eye Icons -->
    <g transform="translate(15, 55)">
      <rect width="200" height="150" rx="8" fill="#1e293b"/>

      <!-- Bird's Eye View (Top Down / God Mode) -->
      <g transform="translate(15, 15)">
        <rect width="78" height="60" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
        <circle cx="39" cy="30" r="14" fill="#818cf8"/>
        <text x="12" y="54" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#c084fc">BIRD'S EYE</text>
      </g>

      <!-- Worm's Eye View (Low Angle Looking Up / Monumental) -->
      <g transform="translate(105, 15)">
        <rect width="78" height="60" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
        <!-- Perspective tapering up -->
        <polygon points="39,8 60,45 18,45" fill="#34d399"/>
        <text x="8" y="54" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#34d399">WORM'S EYE</text>
      </g>

      <!-- Dutch Angle (Tilted Axis = Drama / Unease) -->
      <g transform="translate(55, 82)">
        <rect width="90" height="48" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1" transform="rotate(-6, 45, 24)"/>
        <text x="10" y="30" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#fca5a5" transform="rotate(-6, 45, 24)">DUTCH TILT &#176;</text>
      </g>

      <text x="25" y="142" font-family="'Inter', sans-serif" font-size="8.5" fill="#c084fc">Break standard 5-foot eye level</text>
    </g>

    <g transform="translate(15, 220)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Breaking Eye Level:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Eye level is how humans see everyday life (can feel boring)</text>
      <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Worm's Eye: Makes subjects towering, heroic &amp; imposing</text>
      <text x="0" y="82" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Bird's Eye: Omniscient, geometric, reveals layout patterns</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 445)">
    <rect width="720" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">CREATIVE PERSPECTIVE:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Layer for depth, shift horizons intentionally to control grandeur, and shoot from unexpected angles to shock the retina awake.</text>
  </g>
</svg>

