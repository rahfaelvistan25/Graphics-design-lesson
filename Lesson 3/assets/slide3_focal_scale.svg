<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <radialGradient id="spotlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad3)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="260" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">KEY PRINCIPLES &#183; 3.1 &amp; 3.2</text>
    <text x="290" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Focal Point &amp; Scale Relationships</text>
  </g>

  <!-- Left Card: 3.1 FOCAL POINT (The Retinal Target) -->
  <g transform="translate(50, 85)" filter="url(#shadow3)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#38bdf8">3.1 FOCAL POINT (PRIMARY ANCHOR)</text>

    <!-- Visual Arena: Group of Uniform Elements with One Contrasting Anchor -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>
      
      <!-- Monotonous neutral elements -->
      <g fill="#475569" stroke="#334155" stroke-width="1">
        <circle cx="45" cy="40" r="14"/>
        <circle cx="105" cy="40" r="14"/>
        <circle cx="165" cy="40" r="14"/>
        <circle cx="225" cy="40" r="14"/>
        
        <circle cx="45" cy="95" r="14"/>
        <circle cx="105" cy="95" r="14"/>
        <!-- Spot on 165, 95 will be focal point -->
        <circle cx="225" cy="95" r="14"/>
        
        <circle cx="45" cy="150" r="14"/>
        <circle cx="105" cy="150" r="14"/>
        <circle cx="165" cy="150" r="14"/>
        <circle cx="225" cy="150" r="14"/>
      </g>

      <!-- The Spotlight Focal Point (Isolation + Color + Glow + Rings) -->
      <circle cx="165" cy="95" r="42" fill="url(#spotlightGlow)"/>
      <circle cx="165" cy="95" r="22" fill="#fbbf24" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="165" cy="95" r="30" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- Eye tracking vectors pointing into the focal point -->
      <path d="M 45 40 L 140 85" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>
      <path d="M 225 40 L 185 85" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>
      <path d="M 45 150 L 140 105" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>
      <path d="M 225 150 L 185 105" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>

      <text x="95" y="180" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">&#10024; Instant Retinal Magnet</text>
    </g>

    <!-- Principle Explanations -->
    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Key Mechanics of Focal Points:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Contrast: Value, hue, saturation difference</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Isolation: Placed away from the crowd</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Convergence: Pointers and lines lead directly here</text>
    </g>
  </g>

  <!-- Right Card: 3.2 SCALE (Emotional & Proportional Hierarchy) -->
  <g transform="translate(415, 85)" filter="url(#shadow3)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#4f46e5" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#818cf8">3.2 SCALE (SIZE RELATIONSHIPS)</text>

    <!-- Visual Arena: The Colossus vs The Wanderer (David vs Goliath) -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>
      
      <!-- Ground plane -->
      <line x1="20" y1="165" x2="275" y2="165" stroke="#475569" stroke-width="2"/>

      <!-- Giant Monolith (Monumental Scale = Power, Awe, Dominance) -->
      <rect x="130" y="25" width="130" height="140" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
      <text x="145" y="80" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#c7d2fe">MONUMENTAL</text>
      <text x="160" y="98" font-family="'Inter', sans-serif" font-size="10" fill="#a5b4fc">High Scale</text>
      <text x="145" y="114" font-family="'Inter', sans-serif" font-size="9" fill="#818cf8">Dominance &amp; Weight</text>

      <!-- Tiny Silhouette Figure (Small Scale = Vulnerability, Intimacy, Humanity) -->
      <g transform="translate(65, 140)">
        <circle cx="10" cy="5" r="4" fill="#38bdf8"/>
        <line x1="10" y1="9" x2="10" y2="20" stroke="#38bdf8" stroke-width="2.5"/>
        <line x1="5" y1="13" x2="15" y2="13" stroke="#38bdf8" stroke-width="2"/>
        <line x1="10" y1="20" x2="6" y2="25" stroke="#38bdf8" stroke-width="2"/>
        <line x1="10" y1="20" x2="14" y2="25" stroke="#38bdf8" stroke-width="2"/>
      </g>
      <text x="40" y="132" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Subject (Human)</text>

      <!-- Comparative Scale Dimension Line -->
      <line x1="100" y1="30" x2="100" y2="160" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="82" y="95" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f43f5e" transform="rotate(-90, 82, 95)">10&#215; SCALE DELTA</text>
    </g>

    <!-- Principle Explanations -->
    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Psychology of Scale Variations:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Large = Authority, physical proximity, gravitas</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Small = Solitude, vast expanse, delicacy</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Relative Proportion dictates visual narrative</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 445)">
    <rect width="700" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">DESIGN LAW:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">If everything screams for attention with equal scale, nothing is heard. You must establish one primary focal ruler.</text>
  </g>
</svg>

