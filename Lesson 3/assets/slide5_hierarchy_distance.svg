<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <linearGradient id="depthAtmosphere" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad5)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="260" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">KEY PRINCIPLES &#183; 3.5 &amp; 3.6</text>
    <text x="290" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Hierarchy Reading Order &amp; Distance Depth</text>
  </g>

  <!-- Left Card: 3.5 HIERARCHY -->
  <g transform="translate(50, 85)" filter="url(#shadow5)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#9333ea" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#c084fc">3.5 HIERARCHY (READING ORDER)</text>

    <!-- Visual Arena: Clear 3-Tier Hierarchy + Eye Scanning Path (Z-Pattern) -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Level 1: Hero Primary Anchor -->
      <g transform="translate(20, 20)">
        <rect width="255" height="45" rx="6" fill="#7e22ce" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.5"/>
        <circle cx="20" cy="22" r="10" fill="#c084fc"/>
        <text x="17" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#0f172a">1</text>
        <text x="38" y="22" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffffff">LEVEL 1: PRIMARY HOOK</text>
        <text x="38" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#e9d5ff">Largest scale, maximum contrast, first 50ms read</text>
      </g>

      <!-- Level 2: Secondary Supporting Structure -->
      <g transform="translate(20, 75)">
        <rect width="255" height="40" rx="6" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1"/>
        <circle cx="20" cy="20" r="9" fill="#60a5fa"/>
        <text x="17" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#0f172a">2</text>
        <text x="38" y="19" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">LEVEL 2: CONTEXT &amp; VALUE</text>
        <text x="38" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#bfdbfe">Subheadings, key metrics, visual badges</text>
      </g>

      <!-- Level 3: Tertiary Nuance & Detail -->
      <g transform="translate(20, 125)">
        <rect width="255" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="20" cy="18" r="8" fill="#64748b"/>
        <text x="17" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#0f172a">3</text>
        <text x="38" y="18" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">LEVEL 3: TERTIARY DETAILS</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Body text, disclaimers, metadata, subtle borders</text>
      </g>

      <!-- Z-Pattern Laser Scan Arrow -->
      <path d="M 25 18 L 260 18 L 35 155 L 270 155" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.85"/>
      <text x="110" y="178" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">&#8594; Z-Pattern Visual Traverse</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Rules of Hierarchy:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Tells the viewer's brain where to start, linger, and exit</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Size, weight, color saturation, and vertical positioning</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Prevents cognitive overload and visual paralysis</text>
    </g>
  </g>

  <!-- Right Card: 3.6 DISTANCE -->
  <g transform="translate(415, 85)" filter="url(#shadow5)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#34d399">3.6 DISTANCE (SPATIAL DEPTH)</text>

    <!-- Visual Arena: Atmospheric Perspective & Z-Axis Compression -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#0c1222"/>

      <!-- Far Background Mountains (Faint, low contrast, desaturated blue) -->
      <path d="M 0 110 Q 60 70 140 100 T 295 90 L 295 190 L 0 190 Z" fill="#1e293b" opacity="0.6"/>
      <text x="180" y="85" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Distant (Low Contrast)</text>

      <!-- Midground Hills (Moderate contrast, darker) -->
      <path d="M 0 135 Q 80 110 180 130 T 295 120 L 295 190 L 0 190 Z" fill="#162238"/>
      
      <!-- Distant small tree (Scale cue for depth) -->
      <polygon points="120,118 126,134 114,134" fill="#334155"/>

      <!-- Foreground Cliff & Tree (Crisp, 100% black, high contrast, warm details) -->
      <path d="M 0 155 Q 80 145 160 170 L 160 190 L 0 190 Z" fill="#090d16" stroke="#34d399" stroke-width="1"/>
      
      <!-- Crisp Foreground Silhouette Tree -->
      <g transform="translate(30, 95)">
        <polygon points="25,0 35,45 15,45" fill="#34d399"/>
        <polygon points="25,25 39,58 11,58" fill="#10b981"/>
        <rect x="23" y="58" width="4" height="14" fill="#064e3b"/>
      </g>
      <text x="20" y="180" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34d399">Foreground (Sharp)</text>

      <!-- Distance Falloff Arrow -->
      <line x1="260" y1="170" x2="260" y2="40" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="260,35 256,43 264,43" fill="#38bdf8"/>
      <text x="268" y="105" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" transform="rotate(-90, 268, 105)">Z-AXIS DISTANCE</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mechanics of Distance in 2D Art:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Atmospheric Perspective: Objects lose contrast with distance</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Relative Size: Smaller objects appear further away</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Overlapping: The overlapping object is immediately closer</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 445)">
    <rect width="700" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#c084fc">COMPOSITION MASTERY:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Hierarchy organizes your message in time (what to read first); Distance organizes your canvas in space (what feels near vs far).</text>
  </g>
</svg>

