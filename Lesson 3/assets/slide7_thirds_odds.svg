<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad7" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad7)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="280" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TECHNIQUES &#183; 4.1 &amp; 4.2</text>
    <text x="310" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">The Rule of Thirds &amp; The Rule of Odds</text>
  </g>

  <!-- Left Card: 4.1 RULE OF THIRDS -->
  <g transform="translate(50, 85)" filter="url(#shadow7)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#38bdf8">4.1 RULE OF THIRDS (3&#215;3 GRID)</text>

    <!-- Visual: 3x3 Grid with 4 Power Points -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>
      
      <!-- Horizon on lower third line -->
      <line x1="0" y1="126" x2="295" y2="126" stroke="#475569" stroke-width="2"/>
      <polygon points="0,126 295,126 295,190 0,190" fill="#0f172a" opacity="0.6"/>

      <!-- Vertical 1/3 and 2/3 lines -->
      <line x1="98.3" y1="0" x2="98.3" y2="190" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="196.6" y1="0" x2="196.6" y2="190" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
      
      <!-- Horizontal 1/3 and 2/3 lines -->
      <line x1="0" y1="63.3" x2="295" y2="63.3" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="0" y1="126.6" x2="295" y2="126.6" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- 4 Power Intersections -->
      <circle cx="98.3" cy="63.3" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="196.6" cy="63.3" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
      <circle cx="98.3" cy="126.6" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="196.6" cy="126.6" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Subject (Portrait/Sailboat) placed on the Top-Right Power Point -->
      <g transform="translate(196.6, 63.3)">
        <polygon points="0,-25 15,10 0,10" fill="#f8fafc"/>
        <polygon points="-3,-15 -18,10 -3,10" fill="#38bdf8"/>
        <line x1="0" y1="-28" x2="0" y2="12" stroke="#ffffff" stroke-width="2"/>
        <polygon points="-22,12 22,12 16,18 -16,18" fill="#d97706"/>
      </g>

      <text x="140" y="30" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Power Point Anchor &#8594;</text>
      <text x="10" y="145" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Lower 1/3 Horizon</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Why Thirds Outperform Center:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Off-center placement creates energy, asymmetry, and story</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Align horizons to either upper 1/3 (ground) or lower 1/3 (sky)</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; 4 intersection junctions naturally attract human scanning</text>
    </g>
  </g>

  <!-- Right Card: 4.2 RULE OF ODDS -->
  <g transform="translate(415, 85)" filter="url(#shadow7)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#d97706" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#fbbf24">4.2 RULE OF ODDS (1, 3, 5, 7...)</text>

    <!-- Visual: Even (2) vs Odd (3) Psychological Comparison -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Left Sub-Box: Even Group (Pair of 2 - Static Standoff) -->
      <g transform="translate(10, 15)">
        <rect width="130" height="130" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
        <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#f43f5e">EVEN NUMBER (2):</text>
        <circle cx="45" cy="70" r="18" fill="#64748b"/>
        <circle cx="85" cy="70" r="18" fill="#64748b"/>
        <!-- Tension dividing vector -->
        <line x1="65" y1="45" x2="65" y2="95" stroke="#f43f5e" stroke-dasharray="3 2" stroke-width="1.5"/>
        <text x="14" y="112" font-family="'Inter', sans-serif" font-size="8.5" fill="#fca5a5">Dueling pair splits focus</text>
        <text x="28" y="122" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Static stalemate</text>
      </g>

      <!-- Right Sub-Box: Odd Group (Trio of 3 - Dynamic Triangle) -->
      <g transform="translate(155, 15)">
        <rect width="130" height="130" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#10b981">ODD NUMBER (3):</text>
        
        <!-- Triangle formation -->
        <polygon points="65,45 35,92 95,92" fill="none" stroke="#10b981" stroke-dasharray="3 2" stroke-width="1.5"/>
        <circle cx="65" cy="45" r="14" fill="#fbbf24"/>
        <circle cx="35" cy="92" r="12" fill="#38bdf8"/>
        <circle cx="95" cy="92" r="12" fill="#38bdf8"/>

        <text x="12" y="112" font-family="'Inter', sans-serif" font-size="8.5" fill="#6ee7b7">Natural anchor in center</text>
        <text x="24" y="122" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Eye loops perpetually</text>
      </g>

      <text x="70" y="172" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">Triad is the strongest visual unit</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Psychology of Odd Numbers:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; The brain instinctively pairs even objects (2, 4, 6), creating closure</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Odd numbers cannot be evenly paired; one element anchors the center</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Ideal for character groupings, still-life props, and feature cards</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 445)">
    <rect width="700" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">CLASSICAL WISDOM:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Place your hero on a Thirds power point, group supporting elements in Odds (3 or 5), and your canvas will radiate natural harmony.</text>
  </g>
</svg>

