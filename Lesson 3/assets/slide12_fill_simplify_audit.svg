<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad12" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad12)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="250" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TIPS &#183; 5.4, 5.5 &amp; 5.6</text>
    <text x="280" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Filling Frame, Simplification &amp; Master Audit</text>
  </g>

  <!-- Left Card: 5.4 FILLING THE FRAME & 5.5 SIMPLIFICATION & 5.6 CONTRAST -->
  <g transform="translate(40, 85)" filter="url(#shadow12)">
    <rect width="345" height="340" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="42" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#34d399">5.4, 5.5, 5.6 ESSENTIAL TIPS</text>

    <!-- Visual: Before vs After Cropped/Simplified Subject -->
    <g transform="translate(15, 55)">
      <rect width="315" height="135" rx="8" fill="#1e293b"/>

      <!-- Cluttered Mess -->
      <g transform="translate(15, 15)">
        <rect width="135" height="105" rx="6" fill="#0b1120" stroke="#f43f5e" stroke-width="1"/>
        <circle cx="67" cy="52" r="14" fill="#fbbf24"/>
        <!-- Distracting background junk -->
        <rect x="10" y="10" width="20" height="30" fill="#475569"/>
        <line x1="100" y1="10" x2="130" y2="40" stroke="#f43f5e" stroke-width="2"/>
        <circle cx="115" cy="85" r="12" fill="#64748b"/>
        <text x="12" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#fca5a5">&#215; Distracted Frame</text>
      </g>

      <!-- Filled Frame & Simplified (Macro Detail & 100% Impact) -->
      <g transform="translate(165, 15)">
        <rect width="135" height="105" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.5"/>
        <!-- Giant macro fill -->
        <circle cx="67" cy="52" r="42" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
        <circle cx="67" cy="52" r="18" fill="#d97706"/>
        <text x="12" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#6ee7b7">&#10003; Filled &amp; Simplified</text>
      </g>
    </g>

    <g transform="translate(15, 205)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">The 3 Execution Rules:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; <tspan font-weight="bold" fill="#38bdf8">5.4 Fill Frame:</tspan> Get physically closer; discard dead borders</text>
      <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; <tspan font-weight="bold" fill="#34d399">5.5 Simplification:</tspan> Ruthlessly subtract until only truth remains</text>
      <text x="0" y="82" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; <tspan font-weight="bold" fill="#fbbf24">5.6 Contrast:</tspan> Maximize luminance, color &amp; texture disparity</text>
      <text x="0" y="106" font-family="'Inter', sans-serif" font-size="10" fill="#c084fc">&#8226; The Squint Test: If the message dissolves when squinting, simplify!</text>
    </g>
  </g>

  <!-- Right Card: THE MASTER COMPOSITION AUDIT CHECKLIST -->
  <g transform="translate(405, 85)" filter="url(#shadow12)">
    <rect width="355" height="340" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="355" height="42" rx="12" fill="#d97706" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#fbbf24">&#127942; THE 10-POINT COMPOSITION AUDIT</text>

    <!-- Checklist Items -->
    <g transform="translate(16, 52)">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">1. Focal Point:</text>
        <text x="105" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Is there an undeniable #1 hero?</text>
      </g>

      <g transform="translate(0, 26)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">2. Leading Lines:</text>
        <text x="110" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Do vectors steer the eye inward?</text>
      </g>

      <g transform="translate(0, 52)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">3. Rule of Thirds:</text>
        <text x="115" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Key subject on a power intersection?</text>
      </g>

      <g transform="translate(0, 78)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">4. Rule of Odds:</text>
        <text x="110" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Are groupings in 3s, 5s, or 7s?</text>
      </g>

      <g transform="translate(0, 104)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">5. Horizon Line:</text>
        <text x="108" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Deliberately high or low (not 50%)?</text>
      </g>

      <g transform="translate(0, 130)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">6. Depth Planes:</text>
        <text x="110" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Foreground, Midground, Background?</text>
      </g>

      <g transform="translate(0, 156)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">7. Lead Room:</text>
        <text x="100" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Space ahead of subject's gaze?</text>
      </g>

      <g transform="translate(0, 182)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">8. Framing:</text>
        <text x="90" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Sub-frames shielding against border leaks?</text>
      </g>

      <g transform="translate(0, 208)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">9. Balance &amp; Space:</text>
        <text x="125" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Generous negative breathing room?</text>
      </g>

      <g transform="translate(0, 234)">
        <circle cx="8" cy="10" r="7" fill="#10b981"/>
        <text x="5" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff">&#10003;</text>
        <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">10. Simplification:</text>
        <text x="120" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Can anything non-essential be cut?</text>
      </g>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 445)">
    <rect width="720" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">THE COMPOSER'S CREED:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Master the rules until they become instinct; then break them deliberately when emotion and narrative demand it.</text>
  </g>
</svg>

