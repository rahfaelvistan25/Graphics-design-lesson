<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <linearGradient id="laserLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad4)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="260" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">KEY PRINCIPLES &#183; 3.3 &amp; 3.4</text>
    <text x="290" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Contrast Dynamics &amp; Leading Lines</text>
  </g>

  <!-- Left Card: 3.3 CONTRAST -->
  <g transform="translate(50, 85)" filter="url(#shadow4)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#f59e0b" fill-opacity="0.18"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#f59e0b">3.3 CONTRAST (TENSION &amp; POP)</text>

    <!-- Visual Arena: The 4 Types of Compositional Contrast -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Quadrant 1: Light vs Dark (Value) -->
      <g transform="translate(15, 15)">
        <rect width="125" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <circle cx="62" cy="35" r="18" fill="#ffffff"/>
        <text x="14" y="60" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">VALUE: 100% vs 0%</text>
      </g>

      <!-- Quadrant 2: Warm vs Cool (Chromatic) -->
      <g transform="translate(155, 15)">
        <rect width="125" height="70" rx="6" fill="#0369a1" stroke="#334155" stroke-width="1"/>
        <circle cx="217-155" cy="35" r="18" fill="#f97316"/>
        <text x="14" y="60" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#ffffff">COLOR: Cool vs Warm</text>
      </g>

      <!-- Quadrant 3: Sharp vs Soft (Shape/Form) -->
      <g transform="translate(15, 100)">
        <rect width="125" height="70" rx="6" fill="#162238" stroke="#334155" stroke-width="1"/>
        <!-- Soft organic cloud vs sharp diamond -->
        <ellipse cx="40" cy="35" rx="18" ry="12" fill="#475569" opacity="0.7"/>
        <polygon points="85,18 97,35 85,52 73,35" fill="#38bdf8"/>
        <text x="12" y="62" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#94a3b8">SHAPE: Soft vs Razor</text>
      </g>

      <!-- Quadrant 4: Busy vs Empty (Density/Space) -->
      <g transform="translate(155, 100)">
        <rect width="125" height="70" rx="6" fill="#162238" stroke="#334155" stroke-width="1"/>
        <!-- Busy hatch lines on left, clean solo circle on right -->
        <line x1="15" y1="20" x2="35" y2="50" stroke="#64748b" stroke-width="2"/>
        <line x1="25" y1="20" x2="45" y2="50" stroke="#64748b" stroke-width="2"/>
        <line x1="35" y1="20" x2="55" y2="50" stroke="#64748b" stroke-width="2"/>
        <circle cx="95" cy="35" r="12" fill="#34d399"/>
        <text x="10" y="62" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#34d399">DENSITY: Clutter vs Zen</text>
      </g>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Contrast Creates Distinction:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Without contrast, elements blend into wallpaper</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Highest contrast area becomes the instant focal point</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Governs readability, legibility, and visual punch</text>
    </g>
  </g>

  <!-- Right Card: 3.4 LEADING LINES -->
  <g transform="translate(415, 85)" filter="url(#shadow4)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#38bdf8">3.4 LEADING LINES (GAZE PATHWAYS)</text>

    <!-- Visual Arena: Converging Perspective Road & S-Curve -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Horizon line -->
      <line x1="0" y1="75" x2="295" y2="75" stroke="#334155" stroke-width="1"/>

      <!-- Vanishing point subject (Sunrise / Cabin on mountain) -->
      <polygon points="147,55 160,75 134,75" fill="#f59e0b"/>
      <circle cx="147" cy="50" r="12" fill="#fbbf24" opacity="0.8"/>

      <!-- Converging perspective highway lines (Leading straight to vanishing point) -->
      <polygon points="147,75 0,190 295,190" fill="#0f172a" opacity="0.6"/>
      <line x1="0" y1="190" x2="147" y2="75" stroke="#38bdf8" stroke-width="3"/>
      <line x1="295" y1="190" x2="147" y2="75" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Dashed center divider line leading in -->
      <line x1="147.5" y1="75" x2="147.5" y2="190" stroke="#fef08a" stroke-width="2" stroke-dasharray="8 6"/>

      <!-- S-Curve stream / pathway meandering in from side -->
      <path d="M 280 190 Q 200 150 220 115 T 155 77" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
      <text x="180" y="145" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34d399">Hogarth S-Curve &#8594;</text>

      <!-- Eye-tracking laser indicators -->
      <text x="30" y="175" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">&#8593; Eye Entrance Vector</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mechanics of Leading Lines:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Linear Trajectory: Eyes reflexively track parallel lines</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Converging vectors pull gaze straight to the focal payoff</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; S-Curves create graceful, meandering psychological calm</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 445)">
    <rect width="700" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">COMPOSITION SECRET:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Contrast makes the destination shine; leading lines build the highway that drives the viewer's eyes straight there.</text>
  </g>
</svg>

