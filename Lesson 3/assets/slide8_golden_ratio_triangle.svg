<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad8" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad8)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="280" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TECHNIQUES &#183; 4.3 &amp; 4.4</text>
    <text x="310" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">The Golden Ratio (&#934;) &amp; The Golden Triangle</text>
  </g>

  <!-- Left Card: 4.3 THE GOLDEN RATIO (1:1.618 & The Fibonacci Spiral) -->
  <g transform="translate(50, 85)" filter="url(#shadow8)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#d97706" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#fbbf24">4.3 THE GOLDEN RATIO (1:1.618)</text>

    <!-- Visual: Golden Rectangle Grid with Logarithmic Fibonacci Spiral -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Golden Subdivided Grid (295 x 182 approx 1.618) -->
      <!-- Large Square: width = 182, x = 0 -->
      <rect x="10" y="8" width="170" height="170" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="80" y="95" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#fbbf24" opacity="0.5">1.618</text>

      <!-- Sub-square 2: width = 105, x = 180, y = 8 -->
      <rect x="180" y="8" width="105" height="105" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="225" y="65" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" opacity="0.5">1.0</text>

      <!-- Sub-square 3: width = 65, x = 180 + 40, y = 113 -->
      <rect x="220" y="113" width="65" height="65" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>

      <!-- Sub-square 4: width = 40, x = 180, y = 138 -->
      <rect x="180" y="138" width="40" height="40" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>

      <!-- Sub-square 5: width = 25, x = 180, y = 113 -->
      <rect x="180" y="113" width="25" height="25" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>

      <!-- The Golden Spiral Arc (Smooth Fibonacci Path) -->
      <path d="M 10 178 A 170 170 0 0 1 180 8 A 105 105 0 0 1 285 113 A 65 65 0 0 1 220 178 A 40 40 0 0 1 180 138 A 25 25 0 0 1 205 113" stroke="#f59e0b" stroke-width="3" fill="none"/>
      
      <!-- Focal Eye of the Spiral -->
      <circle cx="205" cy="125" r="5" fill="#fef08a"/>
      <circle cx="205" cy="125" r="10" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="2 2"/>
      
      <text x="25" y="30" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">&#934; Divine Proportion</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Characteristics of the Golden Ratio:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Mathematical ratio of 1 to 1.618 found throughout organic life</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; The spiral provides continuous, accelerating organic gaze flow</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Used by Da Vinci, Salvador Dalí, Apple hardware &amp; typography</text>
    </g>
  </g>

  <!-- Right Card: 4.4 THE GOLDEN TRIANGLE -->
  <g transform="translate(415, 85)" filter="url(#shadow8)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#4f46e5" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#818cf8">4.4 THE GOLDEN TRIANGLE</text>

    <!-- Visual: Diagonal Bisection with 2 Perpendicular Intersections -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Inner Frame -->
      <rect x="15" y="15" width="265" height="160" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>

      <!-- Main Diagonal (Bottom-Left to Top-Right) -->
      <line x1="15" y1="175" x2="280" y2="15" stroke="#818cf8" stroke-width="2.5"/>
      
      <!-- Perpendicular 1: From Top-Left corner to Main Diagonal (90 deg) -->
      <!-- Approx intersection: (95, 126) -->
      <line x1="15" y1="15" x2="100" y2="124" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3"/>
      
      <!-- Perpendicular 2: From Bottom-Right corner to Main Diagonal (90 deg) -->
      <!-- Approx intersection: (195, 66) -->
      <line x1="280" y1="175" x2="195" y2="66" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- Right Angle Squares -->
      <polygon points="96,120 102,116 106,122 100,126" fill="none" stroke="#c084fc" stroke-width="1"/>
      <polygon points="191,70 197,74 193,80 187,76" fill="none" stroke="#c084fc" stroke-width="1"/>

      <!-- Golden Triangle Intersection Power Points -->
      <circle cx="100" cy="124" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="195" cy="66" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>

      <text x="135" y="45" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Primary Apex &#8594;</text>
      <text x="35" y="160" font-family="'Inter', sans-serif" font-size="9" fill="#818cf8">Main Diagonal Spine</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Dynamic Triangular Tension:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Breaks the canvas into 3 dynamic, right-angled triangles</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Perfect for high-energy diagonal action (sports, fashion, cinema)</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Two 90&#176; intersections act as potent secondary focal anchors</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 445)">
    <rect width="700" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#c084fc">GEOMETRIC ELEGANCE:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">The Golden Ratio imparts fluid organic poetry, while the Golden Triangle injects bold diagonal tension.</text>
  </g>
</svg>

