<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad6)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="280" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">KEY PRINCIPLES &#183; 3.7, 3.8 &amp; 3.9</text>
    <text x="310" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Balance, Space &amp; Visual Repetition</text>
  </g>

  <!-- 3-Column Layout for 3.7, 3.8, and 3.9 -->

  <!-- Panel 1: 3.7 BALANCE (Fulcrum Seesaw: Symmetrical vs Asymmetrical) -->
  <g transform="translate(40, 85)" filter="url(#shadow6)">
    <rect width="225" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="42" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#38bdf8">3.7 BALANCE</text>

    <!-- Visual: Asymmetrical Fulcrum Balancing 1 Big vs 3 Small -->
    <g transform="translate(15, 55)">
      <rect width="195" height="150" rx="8" fill="#1e293b"/>
      
      <!-- Fulcrum Triangle -->
      <polygon points="97,135 110,150 84,150" fill="#64748b"/>
      
      <!-- Balance Lever Arm (Horizontal = In equilibrium) -->
      <line x1="20" y1="135" x2="175" y2="135" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Left Heavy Anchor: 1 Large Dense Block close to fulcrum -->
      <rect x="35" y="85" width="45" height="48" rx="4" fill="#38bdf8"/>
      <text x="43" y="114" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#0f172a">HEAVY</text>

      <!-- Right Counterbalance: 2 Small Colorful Orbs far out on lever -->
      <circle cx="140" cy="118" r="14" fill="#f59e0b"/>
      <circle cx="165" cy="122" r="10" fill="#c084fc"/>

      <text x="32" y="30" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Asymmetrical Balance</text>
      <text x="25" y="46" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Weight = Size &#215; Distance</text>
    </g>

    <g transform="translate(15, 220)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Key Forms of Balance:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; <tspan font-weight="bold" fill="#38bdf8">Symmetrical:</tspan> Formal, calm, regal, mirrored axis</text>
      <text x="0" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; <tspan font-weight="bold" fill="#f59e0b">Asymmetrical:</tspan> Dynamic, modern, equal visual weight</text>
      <text x="0" y="86" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; <tspan font-weight="bold" fill="#c084fc">Radial:</tspan> Circular centrifugal energy radiating outward</text>
    </g>
  </g>

  <!-- Panel 2: 3.8 SPACE (Macro & Micro Negative Space) -->
  <g transform="translate(285, 85)" filter="url(#shadow6)">
    <rect width="225" height="340" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="42" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#34d399">3.8 SPACE</text>

    <!-- Visual: Negative Space Field with Heroic Island -->
    <g transform="translate(15, 55)">
      <rect width="195" height="150" rx="8" fill="#1e293b"/>
      
      <!-- Outer vast negative space field -->
      <rect x="15" y="15" width="165" height="120" rx="6" fill="#0b1120" stroke="#334155" stroke-dasharray="3 3"/>
      
      <!-- Small Elegant Luxury Subject in Center-Right -->
      <circle cx="115" cy="75" r="24" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
      <circle cx="115" cy="75" r="8" fill="#064e3b"/>

      <!-- Arrows showing breathing room outwards -->
      <line x1="80" y1="75" x2="35" y2="75" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
      <line x1="115" y1="42" x2="115" y2="22" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
      <line x1="115" y1="108" x2="115" y2="128" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>

      <text x="25" y="40" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#34d399">ACTIVE NEGATIVE SPACE</text>
      <text x="25" y="115" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Luxury &amp; Clarity</text>
    </g>

    <g transform="translate(15, 220)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Powers of White Space:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Space is not emptiness; it is an active design element</text>
      <text x="0" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Gives focal points room to command full attention</text>
      <text x="0" y="86" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Clutter creates claustrophobia; space conveys luxury</text>
    </g>
  </g>

  <!-- Panel 3: 3.9 REPETITION (Rhythm, Cadence & The Broken Motif) -->
  <g transform="translate(530, 85)" filter="url(#shadow6)">
    <rect width="230" height="340" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="42" rx="12" fill="#d97706" fill-opacity="0.2"/>
    <text x="16" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#f59e0b">3.9 REPETITION</text>

    <!-- Visual: Rhythmic Pattern with Broken Anomaly Rule -->
    <g transform="translate(15, 55)">
      <rect width="200" height="150" rx="8" fill="#1e293b"/>
      
      <!-- Row 1: Repeating pill shapes -->
      <g fill="#475569">
        <rect x="15" y="25" width="26" height="14" rx="4"/>
        <rect x="50" y="25" width="26" height="14" rx="4"/>
        <rect x="85" y="25" width="26" height="14" rx="4"/>
        <rect x="120" y="25" width="26" height="14" rx="4"/>
        <rect x="155" y="25" width="26" height="14" rx="4"/>
      </g>

      <!-- Row 2: Rhythmic pulse with one broken colored accent -->
      <g fill="#475569">
        <rect x="15" y="55" width="26" height="14" rx="4"/>
        <rect x="50" y="55" width="26" height="14" rx="4"/>
        <!-- Anomaly: Breaks the pattern! -->
        <rect x="85" y="50" width="26" height="24" rx="6" fill="#fbbf24"/>
        <rect x="120" y="55" width="26" height="14" rx="4"/>
        <rect x="155" y="55" width="26" height="14" rx="4"/>
      </g>

      <!-- Row 3 -->
      <g fill="#475569">
        <rect x="15" y="85" width="26" height="14" rx="4"/>
        <rect x="50" y="85" width="26" height="14" rx="4"/>
        <rect x="85" y="85" width="26" height="14" rx="4"/>
        <rect x="120" y="85" width="26" height="14" rx="4"/>
        <rect x="155" y="85" width="26" height="14" rx="4"/>
      </g>

      <text x="65" y="130" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#fbbf24">&#9733; The Anomaly Pop</text>
      <text x="45" y="142" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Pattern established, then broken</text>
    </g>

    <g transform="translate(15, 220)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Rhythm &amp; Cadence:</text>
      <text x="0" y="34" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Repetition creates unity, familiarity, and visual tempo</text>
      <text x="0" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Rhythm guides the eye like drumbeats in music</text>
      <text x="0" y="86" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">&#8226; Break the repetition intentionally to trigger maximum shock</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 445)">
    <rect width="720" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">HARMONY TRIAD:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Balance stabilizes the composition, Space allows it to speak with dignity, and Repetition gives it an unforgettable rhythm.</text>
  </g>
</svg>

