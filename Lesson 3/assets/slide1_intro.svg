<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Perspective Grid / Framing Vectors -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="50" y1="0" x2="50" y2="550"/>
    <line x1="150" y1="0" x2="150" y2="550"/>
    <line x1="250" y1="0" x2="250" y2="550"/>
    <line x1="350" y1="0" x2="350" y2="550"/>
    <line x1="450" y1="0" x2="450" y2="550"/>
    <line x1="550" y1="0" x2="550" y2="550"/>
    <line x1="650" y1="0" x2="650" y2="550"/>
    <line x1="750" y1="0" x2="750" y2="550"/>
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
  </g>

  <!-- Top Title Badge -->
  <g transform="translate(40, 30)">
    <rect width="230" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">RULES OF COMPOSITION</text>
    <text x="260" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">The Invisible Architecture of Visual Attention</text>
  </g>

  <!-- Analogy Box (Top Right) -->
  <g transform="translate(540, 25)" filter="url(#dropShadow)">
    <rect width="220" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">THE DIRECTOR'S BATON:</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Elements = The Orchestra</text>
    <text x="16" y="58" font-family="'Inter', sans-serif" font-size="11" fill="#c084fc">Composition = The Symphony &amp; Score</text>
  </g>

  <!-- Central Visual Matrix: Frame of Vision with Guide Overlays -->
  <g transform="translate(100, 115)" filter="url(#dropShadow)">
    <!-- Viewfinder Frame -->
    <rect x="0" y="0" width="600" height="340" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- Viewfinder Corner Marks -->
    <path d="M 20 40 L 20 20 L 40 20" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 580 40 L 580 20 L 560 20" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 20 300 L 20 320 L 40 320" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 580 300 L 580 320 L 560 320" stroke="#38bdf8" stroke-width="3" fill="none"/>

    <!-- Rule of Thirds Gridlines inside Viewfinder -->
    <line x1="200" y1="0" x2="200" y2="340" stroke="#38bdf8" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke="#38bdf8" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <line x1="0" y1="113" x2="600" y2="113" stroke="#38bdf8" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <line x1="0" y1="227" x2="600" y2="227" stroke="#38bdf8" stroke-dasharray="4 4" stroke-opacity="0.5"/>

    <!-- Golden Intersection Power Points -->
    <circle cx="200" cy="113" r="8" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="200" cy="113" r="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="215" y="105" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">PRIMARY FOCAL ANCHOR</text>

    <circle cx="400" cy="113" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="200" cy="227" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="400" cy="227" r="6" fill="#818cf8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Composition Dynamic Vector Arrows (Leading Paths) -->
    <path d="M 60 310 C 120 280, 160 200, 200 115" stroke="url(#primaryGlow)" stroke-width="4" fill="none" />
    <path d="M 540 310 C 480 260, 420 180, 205 115" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
    
    <!-- Subject Silhouette at Golden Intersection -->
    <g transform="translate(180, 75)">
      <!-- Stylized Lighthouse/Beacon Subject -->
      <polygon points="20,0 28,80 12,80" fill="#f8fafc"/>
      <rect x="14" y="20" width="12" height="6" fill="#0284c7"/>
      <circle cx="20" cy="0" r="10" fill="#fef08a" opacity="0.9" filter="url(#glow)"/>
      <line x1="20" y1="0" x2="-40" y2="-30" stroke="#fef08a" stroke-width="2" stroke-opacity="0.4"/>
      <line x1="20" y1="0" x2="80" y2="-20" stroke="#fef08a" stroke-width="2" stroke-opacity="0.4"/>
    </g>

    <!-- Foreground Mountain / Waves Silhouette -->
    <path d="M 0 340 L 0 280 Q 120 240 240 290 T 480 270 Q 540 260 600 290 L 600 340 Z" fill="#1e293b" opacity="0.85"/>
    <path d="M 0 340 L 0 310 Q 150 280 300 320 T 600 305 L 600 340 Z" fill="#0f172a"/>

    <!-- Flow Annotation -->
    <g transform="translate(25, 290)">
      <rect width="180" height="30" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">&#8594; Natural Entry Leading Line</text>
    </g>
  </g>

  <!-- 3 Pillar Pillars at Bottom -->
  <g transform="translate(100, 475)">
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Intentionality</text>
      <text x="14" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Nothing in frame by accident</text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="180" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#fbbf24">2. Visual Guidance</text>
      <text x="14" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Directing gaze with precision</text>
    </g>
    <g transform="translate(420, 0)">
      <rect width="180" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#34d399">3. Emotional Harmony</text>
      <text x="14" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Balance, tension, and rhythm</text>
    </g>
  </g>
</svg>

