<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad9" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="shadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#bgGrad9)"/>

  <!-- Module Header -->
  <g transform="translate(40, 30)">
    <rect width="280" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TECHNIQUES &#183; 4.5 &amp; 4.6</text>
    <text x="310" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Framing (Sub-Frames) &amp; Visual Dominance</text>
  </g>

  <!-- Left Card: 4.5 FRAMING (A Frame Within a Frame) -->
  <g transform="translate(50, 85)" filter="url(#shadow9)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#34d399">4.5 FRAMING (SUB-FRAMING)</text>

    <!-- Visual: Architectural Archway framing a distant temple/subject -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#0284c7" fill-opacity="0.25"/>

      <!-- Distant bright sky & temple inside the frame -->
      <circle cx="147" cy="85" r="30" fill="#fbbf24" opacity="0.3"/>
      
      <!-- Distant Hero Subject in Bright Light -->
      <g transform="translate(132, 85)">
        <polygon points="15,0 30,25 0,25" fill="#f8fafc"/>
        <rect x="5" y="25" width="20" height="25" fill="#e2e8f0"/>
        <!-- Tiny doorway -->
        <rect x="12" y="38" width="6" height="12" fill="#0f172a"/>
      </g>
      <text x="110" y="150" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#ffffff">SUBJECT SPOTLIGHT</text>

      <!-- Foreground Dark Archway / Sub-Frame (Stone silhouette creating border) -->
      <path d="M 0 0 L 295 0 L 295 190 L 230 190 L 230 80 Q 147 25 65 80 L 65 190 L 0 190 Z" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Stone texture lines on arch -->
      <line x1="20" y1="40" x2="55" y2="40" stroke="#334155" stroke-width="1"/>
      <line x1="240" y1="40" x2="275" y2="40" stroke="#334155" stroke-width="1"/>
      <line x1="120" y1="15" x2="175" y2="15" stroke="#334155" stroke-width="1"/>

      <text x="75" y="28" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#34d399">NATURAL ARCH FRAME</text>
      <text x="25" y="178" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Dark Foreground Border</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Functions of Framing:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Sub-framing isolates the subject and seals the canvas edges</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Archways, windows, foliage, overhanging branches, or shadows</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; In UI design: Modal cards, avatar containers, hero viewports</text>
    </g>
  </g>

  <!-- Right Card: 4.6 DOMINANCE -->
  <g transform="translate(415, 85)" filter="url(#shadow9)">
    <rect width="335" height="340" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="42" rx="12" fill="#e11d48" fill-opacity="0.2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#f43f5e">4.6 DOMINANCE (THE KING OF THE FRAME)</text>

    <!-- Visual: 1 Dominant King Subject vs Subordinate Subjects -->
    <g transform="translate(20, 55)">
      <rect width="295" height="190" rx="8" fill="#1e293b"/>

      <!-- Subordinate background items (Pale, small, desaturated) -->
      <g fill="#334155" opacity="0.6">
        <circle cx="50" cy="80" r="14"/>
        <circle cx="85" cy="130" r="12"/>
        <circle cx="215" cy="55" r="15"/>
        <circle cx="245" cy="110" r="11"/>
        <circle cx="230" cy="160" r="13"/>
      </g>
      <text x="205" y="35" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Subordinates</text>

      <!-- The Dominant Feature: Massive, glowing, high saturation, sharp drop shadow -->
      <g transform="translate(130, 95)" filter="url(#shadow9)">
        <polygon points="0,-40 38,25 -38,25" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
        <polygon points="0,-22 18,15 -18,15" fill="#ffe4e6"/>
        <!-- Crown icon or symbol -->
        <circle cx="0" cy="-45" r="7" fill="#fbbf24"/>
      </g>

      <!-- Dominance Aura Rings -->
      <circle cx="130" cy="95" r="50" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>

      <text x="85" y="165" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#fca5a5">UNDISPUTED DOMINANCE</text>
      <text x="80" y="178" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Size + Warmth + Contrast + Centrality</text>
    </g>

    <g transform="translate(20, 260)">
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">The 4 Methods to Establish Dominance:</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Dominance by Size: Make the hero dramatically larger</text>
      <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Dominance by Color: A single saturated red orb among cool grays</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">&#8226; Dominance by Sharpness: Crystal crisp subject with blurred bokeh</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 445)">
    <rect width="700" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#34d399">POWER PLAY:</text>
    <text x="24" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Frame your subject to block out distractions, then bestow unmistakable dominance so the viewer never doubts who leads the scene.</text>
  </g>
</svg>

