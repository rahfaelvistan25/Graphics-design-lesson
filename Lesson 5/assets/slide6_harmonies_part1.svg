<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="3" fill="url(#primaryAccent)"/>

  <!-- Header Section -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.18)" stroke="#a855f7" stroke-width="1"/>
    <text x="60" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COLOR THEORY</text>
    <text x="135" y="17" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Color Harmonies I: Complementary (Contrast) vs. Analogous (Unity)</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g transform="translate(40, 85)">
    <!-- Left: COMPLEMENTARY -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="345" height="360" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="24" y="36" fill="#fb7185" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">COMPLEMENTARY HARMONY</text>
      <text x="24" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">180&#176; Opposite on the Color Wheel</text>

      <!-- Geometry Visual -->
      <g transform="translate(172, 140)">
        <circle cx="0" cy="0" r="60" fill="none" stroke="#475569" stroke-dasharray="3 3"/>
        <line x1="-55" y1="0" x2="55" y2="0" stroke="#f43f5e" stroke-width="2.5"/>
        <circle cx="-55" cy="0" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
        <circle cx="55" cy="0" r="14" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
        <text x="-55" y="28" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">BLUE</text>
        <text x="55" y="28" fill="#fb923c" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ORANGE</text>
      </g>

      <g transform="translate(24, 235)">
        <text x="0" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Visual Effect:</text>
        <text x="0" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Maximum simultaneous contrast and kinetic vibration. Each color makes the other appear brighter.</text>
        
        <text x="0" y="60" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Famous Examples:</text>
        <text x="0" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Hollywood movie posters (Teal &amp; Orange), Van Gogh's Starry Night, New York Knicks, FedEx.</text>
      </g>
    </g>

    <!-- Right: ANALOGOUS -->
    <g transform="translate(375, 10)">
      <rect x="0" y="0" width="345" height="360" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="36" fill="#34d399" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">ANALOGOUS HARMONY</text>
      <text x="24" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">3 Adjacent Hues (Within 30&#176;&#8211;60&#176; Arc)</text>

      <!-- Geometry Visual -->
      <g transform="translate(172, 140)">
        <circle cx="0" cy="0" r="60" fill="none" stroke="#475569" stroke-dasharray="3 3"/>
        <path d="M -45,-30 A 60 60 0 0 1 45,-30" fill="none" stroke="#10b981" stroke-width="2.5"/>
        <circle cx="-45" cy="-30" r="14" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
        <circle cx="0" cy="-60" r="14" fill="#84cc16" stroke="#ffffff" stroke-width="2"/>
        <circle cx="45" cy="-30" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
        <text x="-45" y="-5" fill="#facc15" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">YELLOW</text>
        <text x="0" y="-78" fill="#a3e635" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">YEL-GRN</text>
        <text x="45" y="-5" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">GREEN</text>
      </g>

      <g transform="translate(24, 235)">
        <text x="0" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Visual Effect:</text>
        <text x="0" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Organic harmony, zero visual tension, peaceful and comforting. Naturally found throughout nature.</text>
        
        <text x="0" y="60" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Famous Examples:</text>
        <text x="0" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">BP logo (Yellow-Green-Dark Green), Mastercard (Red-Orange-Amber), sunset landscape gradients.</text>
      </g>
    </g>
  </g>


  <!-- Footer Note -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="736" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Lesson 5: Visual Design &amp; Communication &#8226; Master Graphic Standards</text>
    <text x="736" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">SHS Digital Arts Curriculum</text>
  </g>
</svg>