<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="3" fill="url(#primaryAccent)"/>

  <!-- Header Section -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.18)" stroke="#a855f7" stroke-width="1"/>
    <text x="60" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COLOR THEORY</text>
    <text x="135" y="17" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Altering Hue: Tints (+White), Shades (+Black), and Tones (+Gray)</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g transform="translate(40, 85)">
    <!-- Base Hue Card -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="720" height="70" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="45" cy="35" r="22" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
      <text x="85" y="32" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">PURE HUE (Base Color: Cobalt Blue #3B82F6)</text>
      <text x="85" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">100% Saturated pigment without additives. The starting point for all value modulations.</text>
    </g>

    <!-- 1. TINT -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="720" height="75" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#38bdf8" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">TINT = HUE + WHITE (Pastels, Highlights, Softer Ambiance)</text>
      <!-- 5 Swatches -->
      <g transform="translate(16, 35)">
        <rect x="0" y="0" width="130" height="28" rx="4" fill="#3b82f6"/>
        <rect x="140" y="0" width="130" height="28" rx="4" fill="#60a5fa"/>
        <rect x="280" y="0" width="130" height="28" rx="4" fill="#93c5fd"/>
        <rect x="420" y="0" width="130" height="28" rx="4" fill="#bfdbfe"/>
        <rect x="560" y="0" width="130" height="28" rx="4" fill="#eff6ff"/>
      </g>
    </g>

    <!-- 2. SHADE -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="720" height="75" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#a855f7" stroke-width="1"/>
      <text x="16" y="24" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">SHADE = HUE + BLACK (Shadows, Drama, Rich Luxury)</text>
      <!-- 5 Swatches -->
      <g transform="translate(16, 35)">
        <rect x="0" y="0" width="130" height="28" rx="4" fill="#3b82f6"/>
        <rect x="140" y="0" width="130" height="28" rx="4" fill="#2563eb"/>
        <rect x="280" y="0" width="130" height="28" rx="4" fill="#1d4ed8"/>
        <rect x="420" y="0" width="130" height="28" rx="4" fill="#1e40af"/>
        <rect x="560" y="0" width="130" height="28" rx="4" fill="#172554"/>
      </g>
    </g>

    <!-- 3. TONE -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="720" height="75" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="16" y="24" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">TONE = HUE + GRAY (Subtlety, Sophistication, Modern UI Backgrounds)</text>
      <!-- 5 Swatches -->
      <g transform="translate(16, 35)">
        <rect x="0" y="0" width="130" height="28" rx="4" fill="#3b82f6"/>
        <rect x="140" y="0" width="130" height="28" rx="4" fill="#4773aa"/>
        <rect x="280" y="0" width="130" height="28" rx="4" fill="#4f6c94"/>
        <rect x="420" y="0" width="130" height="28" rx="4" fill="#506177"/>
        <rect x="560" y="0" width="130" height="28" rx="4" fill="#475569"/>
      </g>
    </g>

    <!-- Practical Application Note -->
    <text x="360" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Creating a professional 10-shade design system token palette starts with one hue modulated across Tints (100–400) and Shades (600–900).</text>
  </g>


  <!-- Footer Note -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="736" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Lesson 5: Visual Design &amp; Communication &#8226; Master Graphic Standards</text>
    <text x="736" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">SHS Digital Arts Curriculum</text>
  </g>
</svg>