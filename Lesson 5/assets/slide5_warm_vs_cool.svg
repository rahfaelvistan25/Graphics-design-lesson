<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="3" fill="url(#primaryAccent)"/>

  <!-- Header Section -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.18)" stroke="#a855f7" stroke-width="1"/>
    <text x="60" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COLOR THEORY</text>
    <text x="135" y="17" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Color Temperature: Warm (Advancing) vs. Cool (Receding) Dynamics</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g transform="translate(40, 85)">
    <!-- Split Canvas -->
    <!-- WARM SIDE -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="345" height="280" rx="12" fill="rgba(239, 68, 68, 0.08)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="24" y="36" fill="#f87171" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">&#128293; WARM COLORS</text>
      <text x="24" y="60" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Reds, Oranges, Yellows, Warm Yellow-Greens</text>
      
      <!-- Color Chips -->
      <g transform="translate(24, 75)">
        <circle cx="20" cy="20" r="18" fill="#ef4444"/>
        <circle cx="65" cy="20" r="18" fill="#f97316"/>
        <circle cx="110" cy="20" r="18" fill="#f59e0b"/>
        <circle cx="155" cy="20" r="18" fill="#eab308"/>
      </g>

      <g transform="translate(24, 130)">
        <text x="0" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">&#8226; Optical Illusion: Visual Advancement</text>
        <text x="12" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Warm colors appear optically closer to the eye and demand immediate attention.</text>
        
        <text x="0" y="64" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">&#8226; Emotional Association:</text>
        <text x="12" y="82" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Energy, passion, heat, danger, urgency, appetite stimulation, and optimism.</text>
        
        <text x="0" y="112" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">&#8226; Best Applied In:</text>
        <text x="12" y="130" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Call-To-Action (CTA) buttons, fast food, clearance banners, high-energy sports.</text>
      </g>
    </g>

    <!-- COOL SIDE -->
    <g transform="translate(375, 10)">
      <rect x="0" y="0" width="345" height="280" rx="12" fill="rgba(59, 130, 246, 0.08)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="24" y="36" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">&#10052; COOL COLORS</text>
      <text x="24" y="60" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Blues, Cyans, Teals, Greens, Cool Violets</text>
      
      <!-- Color Chips -->
      <g transform="translate(24, 75)">
        <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
        <circle cx="65" cy="20" r="18" fill="#06b6d4"/>
        <circle cx="110" cy="20" r="18" fill="#10b981"/>
        <circle cx="155" cy="20" r="18" fill="#8b5cf6"/>
      </g>

      <g transform="translate(24, 130)">
        <text x="0" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">&#8226; Optical Illusion: Visual Recession</text>
        <text x="12" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Cool colors appear to recede backward into the distance, expanding apparent space.</text>
        
        <text x="0" y="64" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">&#8226; Emotional Association:</text>
        <text x="12" y="82" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Calm, stability, trust, authority, serenity, coldness, and clinical precision.</text>
        
        <text x="0" y="112" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">&#8226; Best Applied In:</text>
        <text x="12" y="130" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Financial institutions, corporate software (SaaS), healthcare, meditation apps.</text>
      </g>
    </g>

    <!-- Bottom Bridge -->
    <rect x="0" y="305" width="720" height="75" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#475569" stroke-width="1"/>
    <text x="20" y="332" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">&#9878; Atmospheric Perspective &amp; Depth Hierarchy</text>
    <text x="20" y="352" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Master landscape painters (Monet, Da Vinci) and UI designers place warm tones in the foreground for prominence and cool muted tones in the background to create natural depth.</text>
  </g>


  <!-- Footer Note -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="736" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Lesson 5: Visual Design &amp; Communication &#8226; Master Graphic Standards</text>
    <text x="736" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">SHS Digital Arts Curriculum</text>
  </g>
</svg>