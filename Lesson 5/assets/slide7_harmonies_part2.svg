<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="3" fill="url(#primaryAccent)"/>

  <!-- Header Section -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.18)" stroke="#a855f7" stroke-width="1"/>
    <text x="60" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COLOR THEORY</text>
    <text x="135" y="17" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Color Harmonies II: Monochromatic, Triadic &amp; Tetradic Schemes</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g transform="translate(40, 85)">
    <!-- 3 Harmony Cards -->
    <!-- Card 1: Monochromatic -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="230" height="360" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="18" y="32" fill="#22d3ee" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">MONOCHROMATIC</text>
      <text x="18" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">1 Single Hue + Value Variations</text>
      
      <!-- Palette Swatches -->
      <g transform="translate(18, 70)">
        <rect x="0" y="0" width="194" height="22" rx="4" fill="#083344"/>
        <rect x="0" y="26" width="194" height="22" rx="4" fill="#0e7490"/>
        <rect x="0" y="52" width="194" height="22" rx="4" fill="#06b6d4"/>
        <rect x="0" y="78" width="194" height="22" rx="4" fill="#67e8f9"/>
        <rect x="0" y="104" width="194" height="22" rx="4" fill="#cffafe"/>
      </g>

      <g transform="translate(18, 220)">
        <text x="0" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Strengths:</text>
        <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Impossible to clash. Clean, elegant, corporate, cohesive.</text>
        <text x="0" y="60" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Risk:</text>
        <text x="0" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Can feel monotonous or flat if value contrast is weak.</text>
      </g>
    </g>

    <!-- Card 2: Triadic -->
    <g transform="translate(245, 10)">
      <rect x="0" y="0" width="230" height="360" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="18" y="32" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">TRIADIC SCHEME</text>
      <text x="18" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Equilateral Triangle (120&#176; Spacing)</text>
      
      <!-- Geometry -->
      <g transform="translate(115, 130)">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#475569" stroke-dasharray="2 2"/>
        <polygon points="0,-45 39,22 -39,22" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
        <circle cx="0" cy="-45" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="39" cy="22" r="9" fill="#eab308" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="-39" cy="22" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <g transform="translate(18, 220)">
        <text x="0" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Strengths:</text>
        <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Vibrant and high energy while preserving equilibrium.</text>
        <text x="0" y="60" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Famous Examples:</text>
        <text x="0" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Superman, Burger King, Mondrian's Neo-Plasticism.</text>
      </g>
    </g>

    <!-- Card 3: Tetradic (Rectangle) -->
    <g transform="translate(490, 10)">
      <rect x="0" y="0" width="230" height="360" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="#ec4899" stroke-width="1.5"/>
      <text x="18" y="32" fill="#f472b6" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">TETRADIC (RECTANGLE)</text>
      <text x="18" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Two Complementary Pairs (4 Hues)</text>
      
      <!-- Geometry -->
      <g transform="translate(115, 130)">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#475569" stroke-dasharray="2 2"/>
        <polygon points="-30,-30 30,-30 30,30 -30,30" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1.5"/>
        <circle cx="-30" cy="-30" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
        <circle cx="30" cy="-30" r="8" fill="#22c55e" stroke="#ffffff" stroke-width="1"/>
        <circle cx="30" cy="30" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1"/>
        <circle cx="-30" cy="30" r="8" fill="#f97316" stroke="#ffffff" stroke-width="1"/>
      </g>

      <g transform="translate(18, 220)">
        <text x="0" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Strengths:</text>
        <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Rich variation, multi-faceted storytelling, packaging.</text>
        <text x="0" y="60" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Key Golden Rule:</text>
        <text x="0" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Never use in equal 25% ratios! Let 1 color dominate.</text>
      </g>
    </g>
  </g>


  <!-- Footer Note -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="736" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Lesson 5: Visual Design &amp; Communication &#8226; Master Graphic Standards</text>
    <text x="736" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">SHS Digital Arts Curriculum</text>
  </g>
</svg>