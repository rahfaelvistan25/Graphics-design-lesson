<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="3" fill="url(#primaryAccent)"/>

  <!-- Header Section -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.18)" stroke="#a855f7" stroke-width="1"/>
    <text x="60" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COLOR THEORY</text>
    <text x="135" y="17" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Color Dimensions: Hue, Saturation, and Value (HSV)</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g transform="translate(40, 85)">
    <!-- 3 Dimensions Panels -->
    <!-- Dimension 1: HUE -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="720" height="90" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="#38bdf8" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">1. HUE (H) &#8226; 0&#176; to 360&#176; Spectrum Position</text>
      <text x="16" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">The purest wavelength identity of a color on the color circle with no white, black, or gray added.</text>
      <!-- Gradient Strip -->
      <defs>
        <linearGradient id="hueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff0000"/>
          <stop offset="17%" stop-color="#ffff00"/>
          <stop offset="33%" stop-color="#00ff00"/>
          <stop offset="50%" stop-color="#00ffff"/>
          <stop offset="67%" stop-color="#0000ff"/>
          <stop offset="83%" stop-color="#ff00ff"/>
          <stop offset="100%" stop-color="#ff0000"/>
        </linearGradient>
      </defs>
      <rect x="16" y="55" width="688" height="20" rx="4" fill="url(#hueGrad)" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Dimension 2: SATURATION -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="720" height="90" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="#ec4899" stroke-width="1"/>
      <text x="16" y="24" fill="#ec4899" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">2. SATURATION / CHROMA (S) &#8226; 0% (Dull Neutral Gray) to 100% (Vivid Purity)</text>
      <text x="16" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">The intensity or purity of a hue. Desaturating adds gray until all chromatic vitality is drained.</text>
      <defs>
        <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#64748b"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
      </defs>
      <rect x="16" y="55" width="688" height="20" rx="4" fill="url(#satGrad)" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Dimension 3: VALUE / BRIGHTNESS -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="720" height="90" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="#facc15" stroke-width="1"/>
      <text x="16" y="24" fill="#facc15" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">3. VALUE / BRIGHTNESS (V / B) &#8226; 0% (Pure Black) to 100% (Full Light)</text>
      <text x="16" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">The relative lightness or darkness of a color. Critical for hierarchy, contrast, and optical readability.</text>
      <defs>
        <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000000"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
      </defs>
      <rect x="16" y="55" width="688" height="20" rx="4" fill="url(#valGrad)" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Golden Designer Rule -->
    <rect x="0" y="325" width="720" height="60" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#475569" stroke-width="1"/>
    <text x="20" y="350" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">&#9733; The Pro Designer Rule: Value Does the Work, Color Gets the Credit</text>
    <text x="20" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">If your design fails in black-and-white grayscale due to poor value contrast, adding pretty colors will never save it.</text>
  </g>


  <!-- Footer Note -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="736" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Lesson 5: Visual Design &amp; Communication &#8226; Master Graphic Standards</text>
    <text x="736" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">SHS Digital Arts Curriculum</text>
  </g>
</svg>