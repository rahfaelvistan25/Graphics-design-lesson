<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="3" fill="url(#primaryAccent)"/>

  <!-- Header Section -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.18)" stroke="#a855f7" stroke-width="1"/>
    <text x="60" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COLOR THEORY</text>
    <text x="135" y="17" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Color Models I: RGB Additive Light for Digital Screens</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g transform="translate(40, 85)">
    <!-- Diagram of 3 Overlapping Circles -->
    <g transform="translate(180, 160)">
      <!-- Red Circle -->
      <circle cx="-35" cy="-25" r="75" fill="rgba(255, 0, 0, 0.85)" style="mix-blend-mode: screen;"/>
      <!-- Green Circle -->
      <circle cx="35" cy="-25" r="75" fill="rgba(0, 255, 0, 0.85)" style="mix-blend-mode: screen;"/>
      <!-- Blue Circle -->
      <circle cx="0" cy="35" r="75" fill="rgba(0, 0, 255, 0.85)" style="mix-blend-mode: screen;"/>

      <!-- Labels -->
      <text x="-65" y="-55" fill="#fecaca" font-family="'Inter', sans-serif" font-size="12" font-weight="700">RED</text>
      <text x="65" y="-55" fill="#bbf7d0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">GREEN</text>
      <text x="0" y="130" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">BLUE</text>

      <!-- Center White -->
      <text x="0" y="-5" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="middle">WHITE</text>
      <text x="0" y="10" fill="#0f172a" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">(All Light)</text>
    </g>

    <!-- Right Side Explanations -->
    <g transform="translate(380, 20)">
      <rect x="0" y="0" width="340" height="280" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="32" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">ADDITIVE COLOR SYSTEM (LIGHT)</text>
      <text x="20" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Used on Monitors, Phones, TVs, Projectors</text>

      <g transform="translate(20, 75)">
        <text x="0" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Physical Basis:</text>
        <text x="12" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Starts in total darkness (Black = #000000). Adding photonic light wavelengths increases luminosity until full saturation produces pure White (R:255, G:255, B:255).</text>

        <text x="0" y="74" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Channel Range:</text>
        <text x="12" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Each 8-bit channel ranges from 0 to 255. 256 x 256 x 256 = 16.7 Million distinct colors capable on modern displays.</text>

        <text x="0" y="132" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&#8226; Digital Formats:</text>
        <text x="12" y="150" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">CSS Hex (#RRGGBB), RGB(r, g, b), HSL, Display P3 wide gamut.</text>
      </g>
    </g>

    <!-- Bottom Callout -->
    <rect x="0" y="315" width="720" height="65" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#475569" stroke-width="1"/>
    <text x="20" y="342" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">&#128241; Hardware Reality: Microscopic Subpixels</text>
    <text x="20" y="362" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Zooming into any iPhone Retina or 4K OLED screen reveals millions of tiny Red, Green, and Blue luminous LEDs tricking the optic nerve into seeing white and full photographic color.</text>
  </g>


  <!-- Footer Note -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="736" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Lesson 5: Visual Design &amp; Communication &#8226; Master Graphic Standards</text>
    <text x="736" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">SHS Digital Arts Curriculum</text>
  </g>
</svg>